<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    // Get the requested path
    var path = window.location.pathname;
    // If it's one of the program paths, redirect to index.html?page=...
    // Or simply redirect to index.html and let the client-side router handle it.
    window.location.href = '/' + '?path=' + encodeURIComponent(path) + window.location.search;
  </script>
</head>
<body>Redirecting...</body>
</html>
