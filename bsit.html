<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BSIT — AACCUP Accreditation | OMSC</title>
    <style>
        /* ===== ROOT ===== */
        :root {
            --primary: #0047AB;
            --primary-dark: #002a66;
            --primary-light: #3F7FE0;
            --gold: #D4AF5A;
            --gold-light: #F0D999;
            --gold-dark: #A87F2E;
            --white: #FFFFFF;
            --paper: #F4F6FA;
            --line: #E1E6EE;
            --ink: #1B2430;
            --ink-soft: #5B6472;
            --radius: 8px;
            --shadow: 0 2px 8px rgba(0, 0, 0, .06);
            --shadow-hover: 0 4px 16px rgba(0, 71, 171, .15);
            --ease: cubic-bezier(.4, 0, .2, 1);
            --blue-1: #eef5ff;
            --blue-2: #7fabe8;
            --blue-3: var(--primary-light);
            --blue-4: #1257bf;
            --blue-5: #001f4d;
            --btn-glow: rgba(63, 127, 224, .45);
        }

        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, Tahoma, Geneva, Verdana, sans-serif;
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a {
            color: inherit;
        }
        button {
            font-family: inherit;
        }

        /* ===== HEADER ===== */
        header {
            background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--white);
            padding: 14px 32px;
            box-shadow: 0 2px 14px rgba(0, 20, 60, .3);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 3px solid var(--gold);
        }
        .header-container {
            width: 100%;
            margin: 0;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo-section {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .logo {
            height: 60px;
            width: 60px;
            border-radius: 50%;
            background: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: var(--primary);
            font-size: 1.1rem;
            flex-shrink: 0;
            border: .5px solid var(--gold-light);
            box-shadow: 0 2px 10px rgba(0, 0, 0, .25);
            overflow: hidden;
        }
        .logo img {
            height: 100%;
            width: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .title-block h1 {
            font-size: 1.08rem;
            font-weight: 700;
            letter-spacing: .2px;
            line-height: 1.25;
        }
        .tagline {
            font-size: .7rem;
            opacity: .85;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            color: var(--gold-light);
        }

        /* ===== MAIN ===== */
        main {
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px 16px 60px;
            width: 100%;
        }

        /* ===== BREADCRUMB ===== */
        .breadcrumb {
            font-size: .85rem;
            padding: 0 0 18px;
            color: var(--ink-soft);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }
        .breadcrumb a {
            color: var(--primary);
            text-decoration: none;
            cursor: pointer;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background .2s var(--ease);
        }
        .breadcrumb a:hover {
            text-decoration: underline;
            background: rgba(0, 71, 171, .08);
        }
        .breadcrumb .sep {
            color: var(--line);
        }
        .breadcrumb .current {
            color: var(--ink-soft);
            font-weight: 500;
            padding: 4px 8px;
        }

        /* ===== PAGE HEADER ROW ===== */
        .page-header-row {
            display: grid;
            grid-template-columns: auto 1fr 120px;
            align-items: center;
            gap: 16px;
            margin-bottom: 70px;
        }
        .page-header-row h2 {
            text-align: center;
            margin: 0;
            font-size: clamp(1.35rem, 2.6vw, 1.9rem);
            font-weight: 800;
            letter-spacing: -0.3px;
        }
        .page-header-row .btn-back {
            justify-self: start;
            padding: 8px 20px;
            font-size: .9rem;
        }
        .page-header-row .spacer {
            /* empty for grid balance */
        }

        /* ===== HERO / LANDING ===== */
        .hero {
            text-align: center;
            padding: 20px 20px 44px;
        }
        .eyebrow {
            display: inline-block;
            font-size: .72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--primary);
            font-weight: 700;
            background: rgba(0, 71, 171, .08);
            padding: 6px 14px;
            border-radius: 999px;
            margin-bottom: 16px;
        }
        .hero h2 {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            color: var(--ink);
            margin-bottom: 12px;
            font-weight: 800;
            letter-spacing: -.5px;
        }
        .hero p {
            font-size: 1.1rem;
            color: var(--ink-soft);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* ===== UNIFIED GRID — FLEX + EQUAL SIZE ===== */
        .program-grid,
        .area-grid,
        .param-grid,
        .doc-grid,
        .hierarchy-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-top: 24px;
        }

        /*
            Bawat direktang anak (button) ay may pantay na lapad at taas.
            - lapad: 25% ng container (4 per row)
            - taas: fixed 130px para pantay-pantay ang lahat ng button sa page
            - content centered gamit ang inner flex
        */
        .program-grid>*,
        .area-grid>*,
        .param-grid>*,
        .doc-grid>*,
        .hierarchy-grid>* {
            flex: 0 0 calc(25% - 16px);
            /* 4 columns */
            height: 130px;
            /* fixed height – lahat pantay */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            text-align: center;
            word-break: break-word;
            border-radius: 12px;
            background:
                radial-gradient(120% 140% at 20% -20%, rgba(255, 255, 255, .55) 0%, rgba(255, 255, 255, 0) 45%),
                linear-gradient(165deg, var(--blue-3) 0%, var(--blue-4) 42%, var(--blue-5) 100%);
            border: 1px solid rgba(0, 20, 60, .4);
            color: var(--white);
            text-shadow: 0 1px 3px rgba(0, 10, 40, .45);
            box-shadow:
                0 4px 14px rgba(0, 20, 60, .28),
                inset 0 1px 0 rgba(255, 255, 255, .55),
                inset 0 -10px 16px rgba(0, 10, 40, .28);
            transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s var(--ease), background .35s var(--ease);
            cursor: pointer;
            font-weight: 600;
            position: relative;
            isolation: isolate;
            overflow: hidden;
        }

        /* Gold seam sa itaas */
        .program-grid>*::before,
        .area-grid>*::before,
        .param-grid>*::before,
        .doc-grid>*::before,
        .hierarchy-grid>*::before {
            content: '';
            position: absolute;
            top: 0;
            left: 14%;
            right: 14%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-light) 50%, transparent);
            opacity: .75;
            z-index: 1;
        }

        /* Hover / Focus / Active */
        .program-grid>*:hover,
        .area-grid>*:hover,
        .param-grid>*:hover,
        .doc-grid>*:hover,
        .hierarchy-grid>*:hover {
            background:
                radial-gradient(120% 140% at 20% -20%, rgba(255, 255, 255, .65) 0%, rgba(255, 255, 255, 0) 48%),
                linear-gradient(165deg, #6fa2ea 0%, var(--primary-light) 42%, var(--blue-4) 100%);
            border-color: var(--gold);
            transform: translateY(-3px);
            box-shadow:
                0 10px 24px rgba(0, 20, 60, .35),
                0 0 0 4px var(--btn-glow),
                inset 0 1px 0 rgba(255, 255, 255, .65),
                inset 0 -10px 16px rgba(0, 10, 40, .22);
        }
        .program-grid>*:focus-visible,
        .area-grid>*:focus-visible,
        .param-grid>*:focus-visible,
        .doc-grid>*:focus-visible,
        .hierarchy-grid>*:focus-visible {
            outline: none;
            border-color: var(--gold);
            box-shadow:
                0 4px 14px rgba(0, 20, 60, .28),
                0 0 0 3px var(--gold-light),
                inset 0 1px 0 rgba(255, 255, 255, .55);
        }
        .program-grid>*:active,
        .area-grid>*:active,
        .param-grid>*:active,
        .doc-grid>*:active,
        .hierarchy-grid>*:active {
            transform: scale(.97) translateY(0);
            background: linear-gradient(165deg, var(--blue-5) 0%, #001433 100%);
            box-shadow:
                inset 0 3px 8px rgba(0, 0, 0, .4),
                inset 0 1px 0 rgba(255, 255, 255, .2);
        }

        /* ===== PROGRAM BUTTONS ===== */
        .program-grid>* {
            flex-direction: column;
            padding: 20px 16px;
        }
        .program-grid .code {
            display: block;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #ffffff, var(--gold-light));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
            filter: drop-shadow(0 1px 2px rgba(0, 10, 40, .5));
            margin-bottom: 4px;
        }
        .program-grid .full {
            font-size: .85rem;
            font-weight: 400;
            color: var(--white);
            opacity: .92;
            -webkit-text-fill-color: var(--white);
            /* truncate to 3 lines */
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            max-height: 3.6em;
            line-height: 1.2;
        }

        /* ===== AREA BUTTONS ===== */
        .area-grid>* {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            text-align: left;
            font-size: .95rem;
        }
        .area-grid .num {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: linear-gradient(160deg, var(--gold-light) 0%, var(--gold) 55%, var(--gold-dark) 100%);
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: .78rem;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .6);
        }
        .area-grid .label {
            flex: 1;
            font-weight: 600;
            /* truncate to 3 lines */
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            max-height: 3.6em;
            line-height: 1.2;
        }
        .area-grid .arrow {
            color: var(--white);
            font-size: .8rem;
            opacity: .75;
            flex-shrink: 0;
        }

        /* ===== PARAMETER BUTTONS ===== */
        .param-grid>* {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            text-align: left;
            font-size: .95rem;
        }
        .param-grid .letter {
            flex-shrink: 0;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(160deg, var(--gold-light) 0%, var(--gold) 55%, var(--gold-dark) 100%);
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: .72rem;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .6);
        }
        .param-grid .label {
            flex: 1;
            font-weight: 600;
            /* truncate to 3 lines */
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            max-height: 3.6em;
            line-height: 1.2;
        }
        .param-grid .arrow {
            color: var(--white);
            font-size: .8rem;
            opacity: .75;
            flex-shrink: 0;
        }

        /* ===== DOCUMENT CATEGORY BUTTONS ===== */
        .doc-grid>* {
            flex-direction: column;
            padding: 16px 12px;
        }
        .doc-grid .icon {
            font-size: 2rem;
            display: block;
            margin-bottom: 6px;
        }
        .doc-grid .label {
            display: block;
            font-weight: 700;
            font-size: .95rem;
            color: var(--white);
            /* truncate to 3 lines */
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            max-height: 3.6em;
            line-height: 1.2;
        }
        .doc-grid .desc {
            display: block;
            font-size: .8rem;
            color: var(--white);
            opacity: .85;
        }

        /* ===== HIERARCHY BUTTONS (file browser) ===== */
        .hierarchy-grid>* {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            text-align: left;
            font-weight: 600;
            justify-content: flex-start;
        }
        .hierarchy-grid .file-icon {
            font-size: 1.6rem;
            flex-shrink: 0;
        }
        .hierarchy-grid .file-name {
            flex: 1;
            font-weight: 600;
            word-break: break-word;
            font-size: .9rem;
            /* truncate to 3 lines */
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            max-height: 3.6em;
            line-height: 1.2;
        }
        .hierarchy-grid .arrow {
            font-size: 1.2rem;
            opacity: .7;
            flex-shrink: 0;
            transition: transform .2s var(--ease);
        }
        .hierarchy-grid>*:hover .arrow {
            transform: translateX(4px);
        }

        /* ===== BACK BUTTON ===== */
        .btn-back {
            background: linear-gradient(180deg, #ffffff 0%, var(--paper) 100%);
            border: 2px solid var(--line);
            color: var(--primary);
            text-shadow: none;
            padding: 12px 32px;
            border-radius: var(--radius);
            font-size: .9rem;
            box-shadow:
                0 2px 8px rgba(0, 0, 0, .08),
                inset 0 1px 1px rgba(255, 255, 255, .9);
            cursor: pointer;
            font-weight: 600;
            transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s var(--ease), background .35s var(--ease);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-back:hover {
            background: linear-gradient(180deg, #ffffff 0%, #eef4ff 100%);
            border-color: var(--primary);
            color: var(--primary-dark);
            transform: translateY(-2px);
        }
        .btn-back:active {
            transform: scale(.97);
            background: var(--paper);
        }

        /* ===== OPEN BUTTON ===== */
        .btn-open {
            padding: 12px 32px;
            border-radius: var(--radius);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            font-size: .9rem;
            font-weight: 600;
            background:
                radial-gradient(120% 140% at 20% -20%, rgba(255, 255, 255, .55) 0%, rgba(255, 255, 255, 0) 45%),
                linear-gradient(165deg, var(--blue-3) 0%, var(--blue-4) 42%, var(--blue-5) 100%);
            border: 1px solid rgba(0, 20, 60, .4);
            color: var(--white);
            text-shadow: 0 1px 3px rgba(0, 10, 40, .45);
            box-shadow:
                0 4px 14px rgba(0, 20, 60, .28),
                inset 0 1px 0 rgba(255, 255, 255, .55),
                inset 0 -10px 16px rgba(0, 10, 40, .28);
            transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s var(--ease), background .35s var(--ease);
            cursor: pointer;
        }
        .btn-open:hover {
            background:
                radial-gradient(120% 140% at 20% -20%, rgba(255, 255, 255, .65) 0%, rgba(255, 255, 255, 0) 48%),
                linear-gradient(165deg, #6fa2ea 0%, var(--primary-light) 42%, var(--blue-4) 100%);
            border-color: var(--gold);
            transform: translateY(-3px);
            box-shadow:
                0 10px 24px rgba(0, 20, 60, .35),
                0 0 0 4px var(--btn-glow),
                inset 0 1px 0 rgba(255, 255, 255, .65),
                inset 0 -10px 16px rgba(0, 10, 40, .22);
        }
        .btn-open:active {
            transform: scale(.97) translateY(0);
            background: linear-gradient(165deg, var(--blue-5) 0%, #001433 100%);
            box-shadow:
                inset 0 3px 8px rgba(0, 0, 0, .4),
                inset 0 1px 0 rgba(255, 255, 255, .2);
        }

        /* ===== PDF VIEWER ===== */
        .pdf-container {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            margin: 22px 0 16px;
            border: 1px solid var(--line);
        }
        .pdf-container iframe {
            display: block;
            border: none;
            width: 100%;
            min-height: 700px;
            background: var(--paper);
        }
        .doc-actions {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        /* ===== EMPTY / ERROR ===== */
        .empty-state {
            background: var(--white);
            border: 1px dashed var(--line);
            border-radius: var(--radius);
            padding: 60px 30px;
            text-align: center;
            margin-top: 10px;
            box-shadow: var(--shadow);
        }
        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }
        .empty-state h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: var(--ink);
        }
        .empty-state p {
            color: var(--ink-soft);
            font-size: .95rem;
            margin-bottom: 24px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

        /* ===== FOOTER ===== */
        footer {
            background: var(--primary-dark);
            color: rgba(255, 255, 255, .85);
            text-align: center;
            padding: 22px;
            font-size: .8rem;
            margin-top: auto;
        }
        footer strong {
            color: var(--white);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1023px) {
            .program-grid>*,
            .area-grid>*,
            .param-grid>*,
            .doc-grid>*,
            .hierarchy-grid>* {
                flex: 0 0 calc(33.33% - 16px);
                height: 120px;
            }
        }
        @media (max-width: 767px) {
            .program-grid>*,
            .area-grid>*,
            .param-grid>*,
            .doc-grid>*,
            .hierarchy-grid>* {
                flex: 0 0 calc(50% - 12px);
                height: 110px;
            }
            .title-block h1 {
                font-size: .95rem;
            }
            header {
                padding: 14px 18px;
            }
            .hero h2 {
                font-size: 1.5rem;
            }
            .pdf-container iframe {
                min-height: 420px;
            }
            main {
                padding: 22px 16px 44px;
            }
            .program-grid .code {
                font-size: 1.5rem;
            }
            .doc-actions {
                flex-direction: column;
            }
            .btn-open,
            .btn-back {
                width: 100%;
                justify-content: center;
            }
            .page-header-row {
                grid-template-columns: 1fr;
                justify-items: center;
                gap: 8px;
            }
            .page-header-row .btn-back {
                justify-self: center;
                order: 1;
            }
            .page-header-row h2 {
                order: 2;
            }
        }
        @media (max-width: 479px) {
            .program-grid>*,
            .area-grid>*,
            .param-grid>*,
            .doc-grid>*,
            .hierarchy-grid>* {
                flex: 0 0 100%;
                height: 100px;
            }
        }

        /* ===== ANIMATION ===== */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        #app {
            animation: fadeUp .4s var(--ease);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo-section">
                <div class="logo">
                    <img src="images/OMSU-Logo.png" alt="OMSC Logo" onerror="this.parentElement.innerHTML='OMSC'" />
                </div>
                <div class="title-block">
                    <h1>Occidental Mindoro State University</h1>
                    <span class="tagline">AACCUP</span>
                </div>
            </div>
        </div>
    </header>

    <main id="app"></main>

    <footer>
        <p>&copy; 2026 Occidental Mindoro State University &mdash; <strong>AACCUP Accreditation Document Management System</strong></p>
    </footer>

    <script>
        window.PROGRAM = 'BSIT';
    </script>
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
