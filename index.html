<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AACCUP Accreditation Document System — OMSC</title>
    <style>
        /* ===== RESET & VARIABLES ===== */
        :root {
            --primary: #0047AB;
            --primary-dark: #002a66;
            --primary-light: #3F7FE0;
            --gold: #D4AF5A;
            --gold-light: #F0D999;
            --gold-dark: #A87F2E;
            --white: #FFFFFF;
            --paper: #F4F6FA;
            --line: #E1E6EE;
            --ink: #1B2430;
            --ink-soft: #5B6472;
            --radius: 8px;
            --shadow: 0 2px 8px rgba(0, 0, 0, .06);
            --shadow-hover: 0 4px 16px rgba(0, 71, 171, .15);
            --ease: cubic-bezier(.4, 0, .2, 1);
            --blue-1: #eef5ff;
            --blue-2: #7fabe8;
            --blue-3: var(--primary-light);
            --blue-4: #1257bf;
            --blue-5: #001f4d;
            --btn-glow: rgba(63, 127, 224, .45);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, Tahoma, Geneva, Verdana, sans-serif;
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a {
            color: inherit;
        }
        button {
            font-family: inherit;
        }

        /* ===== HEADER ===== */
        header {
            background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--white);
            padding: 14px 32px;
            box-shadow: 0 2px 14px rgba(0, 20, 60, .3);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 3px solid var(--gold);
        }
        .header-container {
            width: 100%;
            margin: 0;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo-section {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .logo {
            height: 60px;
            width: 60px;
            border-radius: 50%;
            background: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: var(--primary);
            font-size: 1.1rem;
            flex-shrink: 0;
            border: .5px solid var(--gold-light);
            box-shadow: 0 2px 10px rgba(0, 0, 0, .25);
        }
        .logo img {
            height: 100%;
            width: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .title-block h1 {
            font-size: 1.08rem;
            font-weight: 700;
            letter-spacing: .2px;
            line-height: 1.25;
        }
        .tagline {
            font-size: .7rem;
            opacity: .85;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            color: var(--gold-light);
        }

        /* ===== MAIN ===== */
        main {
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 24px 60px;
            width: 100%;
        }

        /* ===== BREADCRUMB ===== */
        .breadcrumb {
            font-size: .85rem;
            padding: 0 0 18px;
            color: var(--ink-soft);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }
        .breadcrumb a {
            color: var(--primary);
            text-decoration: none;
            cursor: pointer;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background .2s var(--ease);
        }
        .breadcrumb a:hover {
            text-decoration: underline;
            background: rgba(0, 71, 171, .08);
        }
        .breadcrumb .sep {
            color: var(--line);
        }
        .breadcrumb .current {
            display: none;
        }

        /* ===== PAGE HEADER ROW ===== */
        .page-header-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 8px;
        }
        .page-header-row h2 {
            flex: 1;
            text-align: center;
            margin: 0;
            font-size: clamp(1.35rem, 2.6vw, 1.9rem);
            font-weight: 800;
            letter-spacing: -0.3px;
        }
        .page-header-row .btn-back {
            flex-shrink: 0;
            padding: 8px 20px;
            font-size: .9rem;
        }
        .page-subtitle {
            text-align: center;
            color: var(--ink-soft);
            font-size: .95rem;
            margin-bottom: 26px;
        }

        /* ===== HERO / LANDING ===== */
        .hero {
            text-align: center;
            padding: 20px 20px 44px;
        }
        .eyebrow {
            display: inline-block;
            font-size: .72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--primary);
            font-weight: 700;
            background: rgba(0, 71, 171, .08);
            padding: 6px 14px;
            border-radius: 999px;
            margin-bottom: 16px;
        }
        .hero h2 {
            font-size: clamp(1.6rem, 3.4vw, 2.4rem);
            color: var(--ink);
            margin-bottom: 12px;
            font-weight: 800;
            letter-spacing: -.5px;
        }
        .hero p {
            font-size: 1.02rem;
            color: var(--ink-soft);
            max-width: 560px;
            margin: 0 auto;
        }

        /* ===== GRIDS ===== */
        .program-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-top: 28px;
        }
        .area-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 18px;
            margin-top: 24px;
        }
        .param-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 18px;
            margin-top: 24px;
        }
        .doc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }
        .hierarchy-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 24px;
        }

        /* ===== GLOSSY CONVEX BUTTONS ===== */
        .btn-program,
        .btn-area,
        .btn-param,
        .btn-doc,
        .btn-file,
        .btn-open,
        .btn-back {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            background:
                radial-gradient(120% 140% at 20% -20%, rgba(255, 255, 255, .55) 0%, rgba(255, 255, 255, 0) 45%),
                linear-gradient(165deg, var(--blue-3) 0%, var(--blue-4) 42%, var(--blue-5) 100%);
            border: 1px solid rgba(0, 20, 60, .4);
            border-radius: 12px;
            color: var(--white);
            text-shadow: 0 1px 3px rgba(0, 10, 40, .45);
            box-shadow:
                0 4px 14px rgba(0, 20, 60, .28),
                inset 0 1px 0 rgba(255, 255, 255, .55),
                inset 0 -10px 16px rgba(0, 10, 40, .28);
            transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s var(--ease), background .35s var(--ease);
            cursor: pointer;
            font-weight: 600;
        }

        .btn-program::before,
        .btn-area::before,
        .btn-param::before,
        .btn-doc::before,
        .btn-file::before {
            content: '';
            position: absolute;
            top: 0;
            left: 14%;
            right: 14%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-light) 50%, transparent);
            opacity: .75;
            z-index: 1;
        }

        .btn-program:hover,
        .btn-area:hover,
        .btn-param:hover,
        .btn-doc:hover,
        .btn-file:hover,
        .btn-open:hover,
        .btn-back:hover {
            background:
                radial-gradient(120% 140% at 20% -20%, rgba(255, 255, 255, .65) 0%, rgba(255, 255, 255, 0) 48%),
                linear-gradient(165deg, #6fa2ea 0%, var(--primary-light) 42%, var(--blue-4) 100%);
            border-color: var(--gold);
            transform: translateY(-3px);
            box-shadow:
                0 10px 24px rgba(0, 20, 60, .35),
                0 0 0 4px var(--btn-glow),
                inset 0 1px 0 rgba(255, 255, 255, .65),
                inset 0 -10px 16px rgba(0, 10, 40, .22);
        }

        .btn-program:focus-visible,
        .btn-area:focus-visible,
        .btn-param:focus-visible,
        .btn-doc:focus-visible,
        .btn-file:focus-visible,
        .btn-open:focus-visible,
        .btn-back:focus-visible {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 4px 14px rgba(0, 20, 60, .28), 0 0 0 3px var(--gold-light), inset 0 1px 0 rgba(255, 255, 255, .55);
        }

        .btn-program:active,
        .btn-area:active,
        .btn-param:active,
        .btn-doc:active,
        .btn-file:active,
        .btn-open:active,
        .btn-back:active {
            transform: scale(.97) translateY(0);
            background: linear-gradient(165deg, var(--blue-5) 0%, #001433 100%);
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .2);
        }

        /* Program Buttons */
        .btn-program {
            padding: 32px 24px;
            border-radius: 14px;
            text-align: center;
            font-size: 1.1rem;
            letter-spacing: .5px;
        }
        .btn-program .code {
            display: block;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #ffffff, var(--gold-light));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
            filter: drop-shadow(0 1px 2px rgba(0, 10, 40, .5));
        }
        .btn-program .full {
            font-size: .85rem;
            font-weight: 400;
            color: var(--white);
            opacity: .92;
        }

        /* Area Buttons */
        .btn-area {
            padding: 20px 24px;
            border-radius: var(--radius);
            text-align: left;
            font-size: .95rem;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .btn-area .num {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: linear-gradient(160deg, var(--gold-light) 0%, var(--gold) 55%, var(--gold-dark) 100%);
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: .78rem;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .6);
        }
        .btn-area .label {
            flex: 1;
            font-weight: 600;
        }
        .btn-area .arrow {
            color: var(--white);
            font-size: .8rem;
            opacity: .75;
        }

        /* Parameter Buttons */
        .btn-param {
            padding: 18px 24px;
            border-radius: var(--radius);
            text-align: left;
            font-size: .95rem;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .btn-param .letter {
            flex-shrink: 0;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(160deg, var(--gold-light) 0%, var(--gold) 55%, var(--gold-dark) 100%);
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: .72rem;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .6);
        }
        .btn-param .label {
            flex: 1;
            font-weight: 600;
        }
        .btn-param .arrow {
            color: var(--white);
            font-size: .8rem;
            opacity: .75;
        }

        /* Document Category Buttons */
        .btn-doc {
            padding: 24px 20px;
            border-radius: var(--radius);
            text-align: center;
        }
        .btn-doc .icon {
            font-size: 2rem;
            display: block;
            margin-bottom: 8px;
        }
        .btn-doc .label {
            display: block;
            font-weight: 700;
            font-size: .95rem;
            margin-bottom: 4px;
            color: var(--white);
        }
        .btn-doc .desc {
            display: block;
            font-size: .8rem;
            color: var(--white);
            opacity: .85;
        }

        /* Hierarchy / File Buttons */
        .hierarchy-grid .btn-file {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 22px;
            border-radius: var(--radius);
            text-align: left;
            width: 100%;
        }
        .hierarchy-grid .btn-file .file-icon {
            font-size: 1.6rem;
        }
        .hierarchy-grid .btn-file .file-name {
            flex: 1;
            font-weight: 600;
        }
        .hierarchy-grid .btn-file .arrow {
            font-size: 1.2rem;
            opacity: .7;
        }
        .hierarchy-grid .btn-file:hover .arrow {
            transform: translateX(4px);
            transition: transform .2s var(--ease);
        }

        /* ===== PDF VIEWER ===== */
        .pdf-container {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            margin: 22px 0 16px;
            border: 1px solid var(--line);
        }
        .pdf-container iframe {
            display: block;
            border: none;
            width: 100%;
            min-height: 700px;
            background: var(--paper);
        }
        .doc-actions {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        /* Action Buttons */
        .btn-open {
            padding: 12px 32px;
            border-radius: var(--radius);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            font-size: .9rem;
        }

        .btn-back {
            background: linear-gradient(180deg, #ffffff 0%, var(--paper) 100%);
            border: 2px solid var(--line);
            color: var(--primary);
            text-shadow: none;
            padding: 12px 32px;
            border-radius: var(--radius);
            font-size: .9rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08), inset 0 1px 1px rgba(255, 255, 255, .9);
        }
        .btn-back:hover {
            background: linear-gradient(180deg, #ffffff 0%, #eef4ff 100%);
            border-color: var(--primary);
            color: var(--primary-dark);
            transform: translateY(-2px);
        }
        .btn-back:active {
            transform: scale(.97);
            background: var(--paper);
        }

        /* ===== EMPTY / ERROR ===== */
        .empty-state {
            background: var(--white);
            border: 1px dashed var(--line);
            border-radius: var(--radius);
            padding: 60px 30px;
            text-align: center;
            margin-top: 10px;
            box-shadow: var(--shadow);
        }
        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }
        .empty-state h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: var(--ink);
        }
        .empty-state p {
            color: var(--ink-soft);
            font-size: .95rem;
            margin-bottom: 24px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

        /* ===== FOOTER ===== */
        footer {
            background: var(--primary-dark);
            color: rgba(255, 255, 255, .85);
            text-align: center;
            padding: 22px;
            font-size: .8rem;
            margin-top: auto;
        }
        footer strong {
            color: var(--white);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .title-block h1 {
                font-size: .95rem;
            }
            header {
                padding: 14px 18px;
            }
            .hero h2 {
                font-size: 1.5rem;
            }
            .program-grid,
            .area-grid,
            .param-grid,
            .doc-grid,
            .hierarchy-grid {
                grid-template-columns: 1fr;
            }
            .pdf-container iframe {
                min-height: 420px;
            }
            main {
                padding: 22px 16px 44px;
            }
            .btn-program {
                padding: 24px 20px;
            }
            .btn-program .code {
                font-size: 1.5rem;
            }
            .doc-actions {
                flex-direction: column;
            }
            .btn-open,
            .btn-back {
                width: 100%;
                justify-content: center;
            }
            .page-header-row {
                flex-wrap: wrap;
                justify-content: center;
            }
            .page-header-row h2 {
                order: 2;
                flex-basis: 100%;
            }
            .page-header-row .btn-back {
                order: 1;
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        #app {
            animation: fadeUp .4s var(--ease);
        }

        /* ===== SERVER CONFIG NOTE (hidden in UI) ===== */
        .server-note {
            display: none;
        }
    </style>
</head>

        // =========================================================

        // =========================================================
        // HIERARCHY PARSING & TREE BUILDING
        // =========================================================
        function parseHierarchyCode(name) {
            var cleaned = name.replace(/\.\s+/g, '.').replace(/\s+\./g, '.');
            var match = cleaned.match(/^([A-Z]\.\d+(?:\.\d+)*)/);
            return match ? match[1] : null;
        }

        function buildHierarchy(files) {
            var root = { children: [] };
            var nodeMap = {};

            files.forEach(function(file) {
                var code = parseHierarchyCode(file.name);
                if (!code) return;
                if (!nodeMap[code]) {
                    nodeMap[code] = {
                        code: code,
                        name: file.name,
                        id: null,
                        index: null,
                        children: []
                    };
                }
            });

            files.forEach(function(file, index) {
                var code = parseHierarchyCode(file.name);
                if (!code) {
                    root.children.push({
                        code: null,
                        name: file.name,
                        id: file.id,
                        index: index,
                        children: []
                    });
                    return;
                }
                var node = nodeMap[code];
                if (node) {
                    node.id = file.id;
                    node.index = index;
                    node.name = file.name;
                }
            });

            var allCodes = Object.keys(nodeMap);
            allCodes.forEach(function(code) {
                var parts = code.split('.');
                if (parts.length === 1) {
                    root.children.push(nodeMap[code]);
                } else {
                    var parentCode = parts.slice(0, -1).join('.');
                    if (nodeMap[parentCode]) {
                        nodeMap[parentCode].children.push(nodeMap[code]);
                    } else {
                        root.children.push(nodeMap[code]);
                    }
                }
            });

            function sortChildren(node) {
                if (node.children) {
                    node.children.sort(function(a, b) {
                        var aParts = a.code.split('.');
                        var bParts = b.code.split('.');
                        for (var i = 0; i < Math.min(aParts.length, bParts.length); i++) {
                            if (aParts[i] !== bParts[i]) {
                                var aNum = parseInt(aParts[i]);
                                var bNum = parseInt(bParts[i]);
                                if (!isNaN(aNum) && !isNaN(bNum)) return aNum - bNum;
                                return aParts[i].localeCompare(bParts[i]);
                            }
                        }
                        return aParts.length - bParts.length;
                    });
                    node.children.forEach(sortChildren);
                }
            }
            sortChildren(root);
            return root.children;
        }

        // =========================================================
        // ROUTER — History API (clean URLs, no .html)
        // =========================================================

        // Detect the base path automatically.
        // If the file is served from a subdirectory (e.g. /aaccup/), we need to strip that.
        // We use the <base> tag if present, or fallback to the pathname minus the filename.
        function getBasePath() {
            var base = document.querySelector('base');
            if (base) {
                var href = base.getAttribute('href') || '';
                return href.replace(/\/+$/, '');
            }
            // Fallback: strip the filename from the pathname
            var path = window.location.pathname;
            // If the path ends with .html, strip it
            var basePath = path.replace(/\/[^/]*\.html$/, '').replace(/\/+$/, '');
            return basePath || '';
        }

        var BASE_PATH = getBasePath();

        function getRouteFromPath() {
            var path = window.location.pathname;
            // Remove base path
            var route = path;
            if (BASE_PATH && path.indexOf(BASE_PATH) === 0) {
                route = path.substring(BASE_PATH.length);
            }
            // Remove leading/trailing slashes
            route = route.replace(/^\/+/, '').replace(/\/+$/, '');
            // If route is empty, it's the landing page
            if (!route) return { page: 'landing' };

            var parts = route.split('/').filter(Boolean);

            // Special case: if the first part looks like a program code
            if (parts.length === 1 && PROGRAMS[parts[0]]) {
                return { page: 'program', program: parts[0] };
            }
            if (parts.length === 2 && PROGRAMS[parts[0]] && AREAS[parts[1]]) {
                return { page: 'area', program: parts[0], area: parts[1] };
            }
            if (parts.length === 3 && PROGRAMS[parts[0]] && AREAS[parts[1]] && AREAS[parts[1]].params[parts[2]]) {
                return { page: 'parameter', program: parts[0], area: parts[1], param: parts[2] };
            }
            if (parts.length === 4 && PROGRAMS[parts[0]] && AREAS[parts[1]] && AREAS[parts[1]].params[parts[2]] &&
                CATEGORIES.some(function(c) { return c.key === parts[3]; })) {
                return { page: 'category', program: parts[0], area: parts[1], param: parts[2], category: parts[3] };
            }
            if (parts.length === 5 && PROGRAMS[parts[0]] && AREAS[parts[1]] && AREAS[parts[1]].params[parts[2]] &&
                CATEGORIES.some(function(c) { return c.key === parts[3]; })) {
                var idx = parseInt(parts[4]);
                if (!isNaN(idx)) {
                    return { page: 'document', program: parts[0], area: parts[1], param: parts[2], category: parts[3],
                        fileIndex: idx };
                }
            }

            // If we have extra parts (hierarchy path), we need to parse them
            // The format is: /program/area/param/category/hierarchy.../fileIndex
            // But we'll handle hierarchy in the category page via state.currentPath
            // For deep links with hierarchy, we store the extra parts in currentPath
            if (parts.length >= 4) {
                var prog = parts[0];
                var ar = parts[1];
                var par = parts[2];
                var cat = parts[3];
                if (PROGRAMS[prog] && AREAS[ar] && AREAS[ar].params[par] && CATEGORIES.some(function(c) { return c.key ===
                        cat; })) {
                    var rest = parts.slice(4);
                    var fileIdx = null;
                    var pathParts = [];
                    // The last part might be a file index (number) or a hierarchy code
                    for (var i = 0; i < rest.length; i++) {
                        var p = rest[i];
                        if (i === rest.length - 1 && !isNaN(parseInt(p)) && p !== '') {
                            fileIdx = parseInt(p);
                        } else {
                            pathParts.push(p);
                        }
                    }
                    if (fileIdx !== null) {
                        return { page: 'document', program: prog, area: ar, param: par, category: cat, fileIndex: fileIdx,
                            currentPath: pathParts };
                    } else {
                        return { page: 'category', program: prog, area: ar, param: par, category: cat,
                            currentPath: pathParts };
                    }
                }
            }

            return { page: 'landing' };
        }

        // State
        var state = {
            page: 'landing',
            program: null,
            area: null,
            param: null,
            category: null,
            fileIndex: null,
            currentPath: []
        };

        function buildPath(routeData) {
            var parts = [];
            if (routeData.program) parts.push(routeData.program);
            if (routeData.area) parts.push(routeData.area);
            if (routeData.param) parts.push(routeData.param);
            if (routeData.category) parts.push(routeData.category);
            if (routeData.currentPath && routeData.currentPath.length) {
                parts = parts.concat(routeData.currentPath);
            }
            if (routeData.fileIndex !== null && routeData.fileIndex !== undefined) {
                parts.push(String(routeData.fileIndex));
            }
            return '/' + parts.join('/');
        }

        function navigateTo(page, data) {
            // Merge data into a route object
            var routeData = {
                page: page,
                program: data.program || null,
                area: data.area || null,
                param: data.param || null,
                category: data.category || null,
                fileIndex: data.fileIndex !== undefined ? data.fileIndex : null,
                currentPath: data.currentPath || []
            };

            // Update state
            state = { page: page, program: routeData.program, area: routeData.area, param: routeData.param,
                category: routeData.category, fileIndex: routeData.fileIndex, currentPath: routeData.currentPath || [] };

            var path = buildPath(routeData);
            var fullUrl = (BASE_PATH || '') + path;
            history.pushState({ route: routeData }, '', fullUrl);
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Handle popstate (back/forward)
        window.addEventListener('popstate', function(e) {
            var routeData = e.state ? e.state.route : null;
            if (routeData) {
                state = { page: routeData.page, program: routeData.program, area: routeData.area, param: routeData.param,
                    category: routeData.category, fileIndex: routeData.fileIndex, currentPath: routeData.currentPath ||
                        [] };
            } else {
                var parsed = getRouteFromPath();
                state = { page: parsed.page, program: parsed.program || null, area: parsed.area || null,
                    param: parsed.param || null, category: parsed.category || null, fileIndex: parsed.fileIndex !==
                        undefined ? parsed.fileIndex : null, currentPath: parsed.currentPath || [] };
            }
            render();
        });

        // =========================================================
        // RENDER FUNCTIONS
        // =========================================================
        function crumb(items) {
            var clickable = items.slice(0, -1);
            if (clickable.length === 0) return '';
            var html = '<nav class="breadcrumb">';
            clickable.forEach(function(it, i) {
                html += '<a href="#" data-crumb="' + i + '">' + it.label + '</a>';
                if (i < clickable.length - 1) html += '<span class="sep">/</span>';
            });
            html += '</nav>';
            return html;
        }

        function bindCrumbs(container, items) {
            var clickable = items.slice(0, -1);
            container.querySelectorAll('[data-crumb]').forEach(function(a) {
                var idx = Number(a.dataset.crumb);
                if (idx < clickable.length) {
                    a.addEventListener('click', function(e) {
                        e.preventDefault();
                        clickable[idx].go();
                    });
                }
            });
        }

        function render() {
            var app = document.getElementById('app');
            app.innerHTML = '';

            // Validate state
            if (state.page === 'program' && !PROGRAMS[state.program]) state = { page: 'landing', currentPath: [] };
            if (state.page === 'area' && !AREAS[state.area]) state = { page: 'program', program: state.program,
                currentPath: [] };
            if (state.page === 'parameter' && (!AREAS[state.area] || !AREAS[state.area].params[state.param])) state = {
                page: 'area', program: state.program, area: state.area, currentPath: [] };
            if (state.page === 'category' && !CATEGORIES.some(function(c) { return c.key === state.category; })) state = {
                page: 'parameter', program: state.program, area: state.area, param: state.param, currentPath: [] };

            var node;
            switch (state.page) {
                case 'landing':
                    node = renderLanding();
                    break;
                case 'program':
                    node = renderProgram();
                    break;
                case 'area':
                    node = renderArea();
                    break;
                case 'parameter':
                    node = renderParameter();
                    break;
                case 'category':
                    node = renderCategory();
                    break;
                case 'document':
                    node = renderDocument();
                    break;
                default:
                    node = renderLanding();
            }
            app.appendChild(node);
            // Trigger re-animation
            void app.offsetWidth;
            app.style.animation = 'none';
            void app.offsetHeight;
            app.style.animation = '';
        }

            var areaData = AREAS[area];
            var paramName = areaData.params[param];
            var catInfo = CATEGORIES.find(function(c) { return c.key === category; });
            var files = getDocumentFiles(program, area, param, category);
            var tree = buildHierarchy(files);

            if (!state.currentPath || !Array.isArray(state.currentPath)) {
                state.currentPath = [];
            }

            var currentNode = { children: tree };
            for (var ci = 0; ci < state.currentPath.length; ci++) {
                var code = state.currentPath[ci];
                var child = currentNode.children.find(function(c) { return c.code === code; });
                if (!child) {
                    state.currentPath = [];
                    currentNode = { children: tree };
                    break;
                }
                currentNode = child;
            }
            var displayNodes = currentNode.children || [];

            var pathLabels = [];
            var temp = { children: tree };
            for (var pi = 0; pi < state.currentPath.length; pi++) {
                var pc = state.currentPath[pi];
                var ch = temp.children.find(function(c) { return c.code === pc; });
                if (!ch) break;
                pathLabels.push({ code: ch.code, name: ch.name });
                temp = ch;
            }

            var wrap = document.createElement('div');
            var crumbItems = [
                { label: 'Home', go: function() { navigateTo('landing', { currentPath: [] }); } },
                { label: program, go: function() { navigateTo('program', { program: program, currentPath: [] }); } },
                { label: 'Area ' + area, go: function() { navigateTo('area', { program: program, area: area,
                            currentPath: [] }); } },
                { label: 'Parameter ' + param, go: function() { navigateTo('parameter', { program: program, area: area,
                            param: param, currentPath: [] }); } },
                { label: catInfo.label, go: function() { navigateTo('category', { program: program, area: area,
                            param: param, category: category, currentPath: [] }); } }
            ];
            pathLabels.forEach(function(p, idx) {
                var pathUpTo = state.currentPath.slice(0, idx + 1);
                crumbItems.push({
                    label: p.code,
                    go: function() {
                        navigateTo('category', { program: program, area: area, param: param,
                            category: category, currentPath: pathUpTo });
                    }
                });
            });

            var backTarget, backLabel;
            if (state.currentPath && state.currentPath.length > 0) {
                var parentPath = state.currentPath.slice(0, -1);
                backTarget = function() {
                    navigateTo('category', { program: program, area: area, param: param, category: category,
                        currentPath: parentPath });
                };
                backLabel = '← Back';
            } else {
                backTarget = function() {
                    navigateTo('parameter', { program: program, area: area, param: param, currentPath: [] });
                };
                backLabel = '← Back to Parameter';
            }

            var htmlContent = `
            ${crumb(crumbItems)}
            <div class="page-header-row">
              <button class="btn-back" data-back-category>${backLabel}</button>
              <h2>${catInfo.label}</h2>
            </div>
            <p class="page-subtitle">${paramName}</p>
          `;

            if (displayNodes.length === 0) {
                htmlContent +=
                    `
              <div class="empty-state">
                <div class="icon">📁</div>
                <h3>No items in this level</h3>
                <p>This folder is empty.</p>
              </div>
            `;
            } else {
                htmlContent += '<div class="hierarchy-grid">';
                displayNodes.forEach(function(node) {
                    var isLeaf = node.children.length === 0;
                    var icon = isLeaf ? '📄' : '📂';
                    var arrow = '›';
                    var dataAttr = isLeaf ? 'data-index="' + node.index + '"' : 'data-code="' + node.code + '"';
                    htmlContent +=
                        '<button class="btn-file" ' + dataAttr + '><span class="file-icon">' + icon +
                        '</span><span class="file-name">' + node.name + '</span><span class="arrow">' + arrow +
                        '</span></button>';
                });
                htmlContent += '</div>';
            }

            wrap.innerHTML = htmlContent;
            bindCrumbs(wrap, crumbItems);
            wrap.querySelector('[data-back-category]').addEventListener('click', backTarget);

            wrap.querySelectorAll('.btn-file').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var index = this.dataset.index;
                    if (index !== undefined) {
                        navigateTo('document', { program: program, area: area, param: param,
                            category: category, fileIndex: parseInt(index), currentPath: state
                                .currentPath || [] });
                    } else {
                        var code = this.dataset.code;
                        if (code) {
                            var newPath = (state.currentPath || []).concat([code]);
                            navigateTo('category', { program: program, area: area, param: param,
                                category: category, currentPath: newPath });
                        }
                    }
                });
            });

            return wrap;
        }

        function renderDocument() {
            var program = state.program,
                area = state.area,
                param = state.param,
                category = state.category,
                fileIndex = state.fileIndex;
            var areaData = AREAS[area];
            var paramName = areaData.params[param];
            var catInfo = CATEGORIES.find(function(c) { return c.key === category; });
            var files = getDocumentFiles(program, area, param, category);
            var file = files[fileIndex];

            var wrap = document.createElement('div');
            var crumbItems = [
                { label: 'Home', go: function() { navigateTo('landing', { currentPath: [] }); } },
                { label: program, go: function() { navigateTo('program', { program: program, currentPath: [] }); } },
                { label: 'Area ' + area, go: function() { navigateTo('area', { program: program, area: area,
                            currentPath: [] }); } },
                { label: 'Parameter ' + param, go: function() { navigateTo('parameter', { program: program, area: area,
                            param: param, currentPath: [] }); } },
                { label: catInfo.label, go: function() { navigateTo('category', { program: program, area: area,
                            param: param, category: category, currentPath: state.currentPath || [] }); } }
            ];
            // Add hierarchy breadcrumbs
            var filesForCategory = getDocumentFiles(program, area, param, category);
            var tree = buildHierarchy(filesForCategory);
            var pathLabels = [];
            var temp = { children: tree };
            for (var pi = 0; pi < (state.currentPath || []).length; pi++) {
                var pc = (state.currentPath || [])[pi];
                var ch = temp.children.find(function(c) { return c.code === pc; });
                if (!ch) break;
                pathLabels.push({ code: ch.code, name: ch.name });
                temp = ch;
            }
            pathLabels.forEach(function(p, idx) {
                var pathUpTo = (state.currentPath || []).slice(0, idx + 1);
                crumbItems.push({
                    label: p.code,
                    go: function() {
                        navigateTo('category', { program: program, area: area, param: param,
                            category: category, currentPath: pathUpTo });
                    }
                });
            });

            if (!file) {
                wrap.innerHTML =
                    `
              ${crumb(crumbItems)}
              <div class="page-header-row">
                <button class="btn-back" data-back-files>← Back to files</button>
                <h2>File not found</h2>
              </div>
              <div class="empty-state">
                <div class="icon">❌</div>
                <p>The requested document could not be found.</p>
              </div>
            `;
                bindCrumbs(wrap, crumbItems);
                wrap.querySelector('[data-back-files]').addEventListener('click', function() {
                    navigateTo('category', { program: program, area: area, param: param, category: category,
                        currentPath: state.currentPath || [] });
                });
                return wrap;
            }

            var previewLink = getDriveLink(file.id);
            var openLink = getDriveOpenLink(file.id);

            wrap.innerHTML =
                `
            ${crumb(crumbItems)}
            <div class="page-header-row">
              <button class="btn-back" data-back-files>← Back to files</button>
              <h2>${file.name}</h2>
            </div>
            <p class="page-subtitle">${catInfo.label} — ${paramName}</p>
            ${previewLink ? '<div class="pdf-container"><iframe src="'+previewLink+'" allow="autoplay" title="'+file.name+'"></iframe></div><div class="doc-actions"><a class="btn-open" href="'+openLink+'" target="_blank" rel="noopener">Open in new tab</a><button class="btn-back" data-back-files-alt>← Back to files</button></div>' : '<div class="empty-state"><div class="icon">📄</div><h3>Document not yet linked</h3><p>No Google Drive file has been assigned to this document yet.</p><p style="font-size:.8rem;color:var(--ink-soft);margin-top:8px;">File ID: '+file.id+'</p><button class="btn-back" data-back-files-alt>← Back to files</button></div>'}
          `;
            bindCrumbs(wrap, crumbItems);
            wrap.querySelectorAll('[data-back-files], [data-back-files-alt]').forEach(function(b) {
                b.addEventListener('click', function() {
                    navigateTo('category', { program: program, area: area, param: param, category: category,
                        currentPath: state.currentPath || [] });
                });
            });
            return wrap;
        }

        // =========================================================
        // INITIALIZATION
        // =========================================================
        function initApp(programCode) {
            var parsed = getRouteFromPath();
            if (programCode && PROGRAMS[programCode]) {
                if (parsed.page === 'landing' || !parsed.program) {
                    state = { page: 'program', program: programCode, currentPath: [] };
                    var path = buildPath({ page: 'program', program: programCode, currentPath: [] });
                    var fullUrl = (BASE_PATH || '') + path;
                    history.replaceState({ route: { page: 'program', program: programCode, currentPath: [] } }, '',
                        fullUrl);
                } else {
                    state = { page: parsed.page, program: parsed.program || null, area: parsed.area || null,
                        param: parsed.param || null, category: parsed.category || null, fileIndex: parsed
                            .fileIndex !== undefined ? parsed.fileIndex : null, currentPath: parsed.currentPath ||
                            [] };
                }
            } else {
                if (parsed.page === 'landing') {
                    state = { page: 'landing', currentPath: [] };
                    var homePath = '/';
                    history.replaceState({ route: { page: 'landing', currentPath: [] } }, '', homePath);
                } else {
                    state = { page: parsed.page, program: parsed.program || null, area: parsed.area || null,
                        param: parsed.param || null, category: parsed.category || null, fileIndex: parsed
                            .fileIndex !== undefined ? parsed.fileIndex : null, currentPath: parsed.currentPath ||
                            [] };
                }
            }
            render();
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Default to BSIT if no route is present
            var parsed = getRouteFromPath();
            if (parsed.page === 'landing') {
                initApp('BSIT');
            } else {
                initApp(null);
            }
        });

        // Handle direct navigation (e.g., typing URL) - the server should serve this HTML for all routes.
        // If the server isn't configured, we rely on the hash fallback, but we're using History API.
        // For servers that don't support SPA routing, we add a fallback: if the page loads and the path
        // doesn't match any route, we redirect to the base path with the route in the hash.
        // But since we want clean URLs, we assume the server is configured correctly.
        // If the user opens the file directly (file://), we use the hash as a fallback.
        if (window.location.protocol === 'file:') {
            // Fallback to hash-based routing for file:// protocol
            // We'll use the hash to store the route
            var hash = window.location.hash;
            if (hash) {
                var routeFromHash = hash.replace(/^#/, '');
                if (routeFromHash) {
                    var fakePath = '/' + routeFromHash;
                    history.replaceState(null, '', fakePath);
                }
            }
            // Re-run the route parser
            var parsed2 = getRouteFromPath();
            if (parsed2.page === 'landing') {
                initApp('BSIT');
            } else {
                initApp(null);
            }
        }

        console.log('🔗 Clean URLs enabled — .html is hidden.');
        console.log('📁 Base path:', BASE_PATH || '/');
        console.log('📍 Current route:', window.location.pathname);
    </script>

</body>
</html>
