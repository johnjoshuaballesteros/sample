<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AACCUP Accreditation Document System — OMSC</title>
    <style>
        /* ===== ROOT ===== */
        :root {
            --primary: #0047AB;
            --primary-dark: #002a66;
            --primary-light: #3F7FE0;
            --gold: #D4AF5A;
            --gold-light: #F0D999;
            --gold-dark: #A87F2E;
            --white: #FFFFFF;
            --paper: #F4F6FA;
            --line: #E1E6EE;
            --ink: #1B2430;
            --ink-soft: #5B6472;
            --radius: 8px;
            --shadow: 0 2px 8px rgba(0, 0, 0, .06);
            --shadow-hover: 0 4px 16px rgba(0, 71, 171, .15);
            --ease: cubic-bezier(.4, 0, .2, 1);
            --blue-1: #eef5ff;
            --blue-2: #7fabe8;
            --blue-3: var(--primary-light);
            --blue-4: #1257bf;
            --blue-5: #001f4d;
            --btn-glow: rgba(63, 127, 224, .45);
        }

        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, Tahoma, Geneva, Verdana, sans-serif;
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a {
            color: inherit;
        }
        button {
            font-family: inherit;
        }

        /* ===== HEADER ===== */
        header {
            background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--white);
            padding: 14px 32px;
            box-shadow: 0 2px 14px rgba(0, 20, 60, .3);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 3px solid var(--gold);
        }
        .header-container {
            width: 100%;
            margin: 0;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo-section {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .logo {
            height: 60px;
            width: 60px;
            border-radius: 50%;
            background: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: var(--primary);
            font-size: 1.1rem;
            flex-shrink: 0;
            border: .5px solid var(--gold-light);
            box-shadow: 0 2px 10px rgba(0, 0, 0, .25);
            overflow: hidden;
        }
        .logo img {
            height: 100%;
            width: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .title-block h1 {
            font-size: 1.08rem;
            font-weight: 700;
            letter-spacing: .2px;
            line-height: 1.25;
        }
        .tagline {
            font-size: .7rem;
            opacity: .85;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            color: var(--gold-light);
        }

        /* ===== MAIN ===== */
        main {
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px 16px 60px;
            width: 100%;
        }

        /* ===== BREADCRUMB ===== */
        .breadcrumb {
            font-size: .85rem;
            padding: 0 0 18px;
            color: var(--ink-soft);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }
        .breadcrumb a {
            color: var(--primary);
            text-decoration: none;
            cursor: pointer;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background .2s var(--ease);
        }
        .breadcrumb a:hover {
            text-decoration: underline;
            background: rgba(0, 71, 171, .08);
        }
        .breadcrumb .sep {
            color: var(--line);
        }
        .breadcrumb .current {
            color: var(--ink-soft);
            font-weight: 500;
            padding: 4px 8px;
        }

        /* ===== PAGE HEADER ROW ===== */
        .page-header-row {
            display: grid;
            grid-template-columns: auto 1fr 120px;
            align-items: center;
            gap: 16px;
            margin-bottom: 70px;
        }
        .page-header-row h2 {
            text-align: center;
            margin: 0;
            font-size: clamp(1.35rem, 2.6vw, 1.9rem);
            font-weight: 800;
            letter-spacing: -0.3px;
        }
        .page-header-row .btn-back {
            justify-self: start;
            padding: 8px 20px;
            font-size: .9rem;
        }
        .page-header-row .spacer {
            /* empty for grid balance */
        }

        /* ===== HERO / LANDING ===== */
        .hero {
            text-align: center;
            padding: 20px 20px 44px;
        }
        .eyebrow {
            display: inline-block;
            font-size: .72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--primary);
            font-weight: 700;
            background: rgba(0, 71, 171, .08);
            padding: 6px 14px;
            border-radius: 999px;
            margin-bottom: 16px;
        }
        .hero h2 {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            color: var(--ink);
            margin-bottom: 12px;
            font-weight: 800;
            letter-spacing: -.5px;
        }
        .hero p {
            font-size: 1.1rem;
            color: var(--ink-soft);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* ===== UNIFIED GRID — FLEX + EQUAL SIZE ===== */
        .program-grid,
        .area-grid,
        .param-grid,
        .doc-grid,
        .hierarchy-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-top: 24px;
        }

        /*
            Bawat direktang anak (button) ay may pantay na lapad at taas.
            - lapad: 25% ng container (4 per row)
            - taas: fixed 130px para pantay-pantay ang lahat ng button sa page
            - content centered gamit ang inner flex
        */
        .program-grid>*,
        .area-grid>*,
        .param-grid>*,
        .doc-grid>*,
        .hierarchy-grid>* {
            flex: 0 0 calc(25% - 16px);
            /* 4 columns */
            height: 130px;
            /* fixed height – lahat pantay */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            text-align: center;
            word-break: break-word;
            border-radius: 12px;
            background:
                radial-gradient(120% 140% at 20% -20%, rgba(255, 255, 255, .55) 0%, rgba(255, 255, 255, 0) 45%),
                linear-gradient(165deg, var(--blue-3) 0%, var(--blue-4) 42%, var(--blue-5) 100%);
            border: 1px solid rgba(0, 20, 60, .4);
            color: var(--white);
            text-shadow: 0 1px 3px rgba(0, 10, 40, .45);
            box-shadow:
                0 4px 14px rgba(0, 20, 60, .28),
                inset 0 1px 0 rgba(255, 255, 255, .55),
                inset 0 -10px 16px rgba(0, 10, 40, .28);
            transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s var(--ease), background .35s var(--ease);
            cursor: pointer;
            font-weight: 600;
            position: relative;
            isolation: isolate;
            overflow: hidden;
        }

        /* Gold seam sa itaas */
        .program-grid>*::before,
        .area-grid>*::before,
        .param-grid>*::before,
        .doc-grid>*::before,
        .hierarchy-grid>*::before {
            content: '';
            position: absolute;
            top: 0;
            left: 14%;
            right: 14%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-light) 50%, transparent);
            opacity: .75;
            z-index: 1;
        }

        /* Hover / Focus / Active */
        .program-grid>*:hover,
        .area-grid>*:hover,
        .param-grid>*:hover,
        .doc-grid>*:hover,
        .hierarchy-grid>*:hover {
            background:
                radial-gradient(120% 140% at 20% -20%, rgba(255, 255, 255, .65) 0%, rgba(255, 255, 255, 0) 48%),
                linear-gradient(165deg, #6fa2ea 0%, var(--primary-light) 42%, var(--blue-4) 100%);
            border-color: var(--gold);
            transform: translateY(-3px);
            box-shadow:
                0 10px 24px rgba(0, 20, 60, .35),
                0 0 0 4px var(--btn-glow),
                inset 0 1px 0 rgba(255, 255, 255, .65),
                inset 0 -10px 16px rgba(0, 10, 40, .22);
        }
        .program-grid>*:focus-visible,
        .area-grid>*:focus-visible,
        .param-grid>*:focus-visible,
        .doc-grid>*:focus-visible,
        .hierarchy-grid>*:focus-visible {
            outline: none;
            border-color: var(--gold);
            box-shadow:
                0 4px 14px rgba(0, 20, 60, .28),
                0 0 0 3px var(--gold-light),
                inset 0 1px 0 rgba(255, 255, 255, .55);
        }
        .program-grid>*:active,
        .area-grid>*:active,
        .param-grid>*:active,
        .doc-grid>*:active,
        .hierarchy-grid>*:active {
            transform: scale(.97) translateY(0);
            background: linear-gradient(165deg, var(--blue-5) 0%, #001433 100%);
            box-shadow:
                inset 0 3px 8px rgba(0, 0, 0, .4),
                inset 0 1px 0 rgba(255, 255, 255, .2);
        }

        /* ===== PROGRAM BUTTONS ===== */
        .program-grid>* {
            flex-direction: column;
            padding: 20px 16px;
        }
        .program-grid .code {
            display: block;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #ffffff, var(--gold-light));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
            filter: drop-shadow(0 1px 2px rgba(0, 10, 40, .5));
            margin-bottom: 4px;
        }
        .program-grid .full {
            font-size: .85rem;
            font-weight: 400;
            color: var(--white);
            opacity: .92;
            -webkit-text-fill-color: var(--white);
            /* truncate to 3 lines */
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            max-height: 3.6em;
            line-height: 1.2;
        }

        /* ===== AREA BUTTONS ===== */
        .area-grid>* {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            text-align: left;
            font-size: .95rem;
        }
        .area-grid .num {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: linear-gradient(160deg, var(--gold-light) 0%, var(--gold) 55%, var(--gold-dark) 100%);
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: .78rem;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .6);
        }
        .area-grid .label {
            flex: 1;
            font-weight: 600;
            /* truncate to 3 lines */
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            max-height: 3.6em;
            line-height: 1.2;
        }
        .area-grid .arrow {
            color: var(--white);
            font-size: .8rem;
            opacity: .75;
            flex-shrink: 0;
        }

        /* ===== PARAMETER BUTTONS ===== */
        .param-grid>* {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            text-align: left;
            font-size: .95rem;
        }
        .param-grid .letter {
            flex-shrink: 0;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(160deg, var(--gold-light) 0%, var(--gold) 55%, var(--gold-dark) 100%);
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: .72rem;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .6);
        }
        .param-grid .label {
            flex: 1;
            font-weight: 600;
            /* truncate to 3 lines */
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            max-height: 3.6em;
            line-height: 1.2;
        }
        .param-grid .arrow {
            color: var(--white);
            font-size: .8rem;
            opacity: .75;
            flex-shrink: 0;
        }

        /* ===== DOCUMENT CATEGORY BUTTONS ===== */
        .doc-grid>* {
            flex-direction: column;
            padding: 16px 12px;
        }
        .doc-grid .icon {
            font-size: 2rem;
            display: block;
            margin-bottom: 6px;
        }
        .doc-grid .label {
            display: block;
            font-weight: 700;
            font-size: .95rem;
            color: var(--white);
            /* truncate to 3 lines */
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            max-height: 3.6em;
            line-height: 1.2;
        }
        .doc-grid .desc {
            display: block;
            font-size: .8rem;
            color: var(--white);
            opacity: .85;
        }

        /* ===== HIERARCHY BUTTONS (file browser) ===== */
        .hierarchy-grid>* {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            text-align: left;
            font-weight: 600;
            justify-content: flex-start;
        }
        .hierarchy-grid .file-icon {
            font-size: 1.6rem;
            flex-shrink: 0;
        }
        .hierarchy-grid .file-name {
            flex: 1;
            font-weight: 600;
            word-break: break-word;
            font-size: .9rem;
            /* truncate to 3 lines */
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            max-height: 3.6em;
            line-height: 1.2;
        }
        .hierarchy-grid .arrow {
            font-size: 1.2rem;
            opacity: .7;
            flex-shrink: 0;
            transition: transform .2s var(--ease);
        }
        .hierarchy-grid>*:hover .arrow {
            transform: translateX(4px);
        }

        /* ===== BACK BUTTON ===== */
        .btn-back {
            background: linear-gradient(180deg, #ffffff 0%, var(--paper) 100%);
            border: 2px solid var(--line);
            color: var(--primary);
            text-shadow: none;
            padding: 12px 32px;
            border-radius: var(--radius);
            font-size: .9rem;
            box-shadow:
                0 2px 8px rgba(0, 0, 0, .08),
                inset 0 1px 1px rgba(255, 255, 255, .9);
            cursor: pointer;
            font-weight: 600;
            transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s var(--ease), background .35s var(--ease);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-back:hover {
            background: linear-gradient(180deg, #ffffff 0%, #eef4ff 100%);
            border-color: var(--primary);
            color: var(--primary-dark);
            transform: translateY(-2px);
        }
        .btn-back:active {
            transform: scale(.97);
            background: var(--paper);
        }

        /* ===== OPEN BUTTON ===== */
        .btn-open {
            padding: 12px 32px;
            border-radius: var(--radius);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            font-size: .9rem;
            font-weight: 600;
            background:
                radial-gradient(120% 140% at 20% -20%, rgba(255, 255, 255, .55) 0%, rgba(255, 255, 255, 0) 45%),
                linear-gradient(165deg, var(--blue-3) 0%, var(--blue-4) 42%, var(--blue-5) 100%);
            border: 1px solid rgba(0, 20, 60, .4);
            color: var(--white);
            text-shadow: 0 1px 3px rgba(0, 10, 40, .45);
            box-shadow:
                0 4px 14px rgba(0, 20, 60, .28),
                inset 0 1px 0 rgba(255, 255, 255, .55),
                inset 0 -10px 16px rgba(0, 10, 40, .28);
            transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s var(--ease), background .35s var(--ease);
            cursor: pointer;
        }
        .btn-open:hover {
            background:
                radial-gradient(120% 140% at 20% -20%, rgba(255, 255, 255, .65) 0%, rgba(255, 255, 255, 0) 48%),
                linear-gradient(165deg, #6fa2ea 0%, var(--primary-light) 42%, var(--blue-4) 100%);
            border-color: var(--gold);
            transform: translateY(-3px);
            box-shadow:
                0 10px 24px rgba(0, 20, 60, .35),
                0 0 0 4px var(--btn-glow),
                inset 0 1px 0 rgba(255, 255, 255, .65),
                inset 0 -10px 16px rgba(0, 10, 40, .22);
        }
        .btn-open:active {
            transform: scale(.97) translateY(0);
            background: linear-gradient(165deg, var(--blue-5) 0%, #001433 100%);
            box-shadow:
                inset 0 3px 8px rgba(0, 0, 0, .4),
                inset 0 1px 0 rgba(255, 255, 255, .2);
        }

        /* ===== PDF VIEWER ===== */
        .pdf-container {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            margin: 22px 0 16px;
            border: 1px solid var(--line);
        }
        .pdf-container iframe {
            display: block;
            border: none;
            width: 100%;
            min-height: 700px;
            background: var(--paper);
        }
        .doc-actions {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        /* ===== EMPTY / ERROR ===== */
        .empty-state {
            background: var(--white);
            border: 1px dashed var(--line);
            border-radius: var(--radius);
            padding: 60px 30px;
            text-align: center;
            margin-top: 10px;
            box-shadow: var(--shadow);
        }
        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }
        .empty-state h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: var(--ink);
        }
        .empty-state p {
            color: var(--ink-soft);
            font-size: .95rem;
            margin-bottom: 24px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

        /* ===== FOOTER ===== */
        footer {
            background: var(--primary-dark);
            color: rgba(255, 255, 255, .85);
            text-align: center;
            padding: 22px;
            font-size: .8rem;
            margin-top: auto;
        }
        footer strong {
            color: var(--white);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1023px) {
            .program-grid>*,
            .area-grid>*,
            .param-grid>*,
            .doc-grid>*,
            .hierarchy-grid>* {
                flex: 0 0 calc(33.33% - 16px);
                height: 120px;
            }
        }
        @media (max-width: 767px) {
            .program-grid>*,
            .area-grid>*,
            .param-grid>*,
            .doc-grid>*,
            .hierarchy-grid>* {
                flex: 0 0 calc(50% - 12px);
                height: 110px;
            }
            .title-block h1 {
                font-size: .95rem;
            }
            header {
                padding: 14px 18px;
            }
            .hero h2 {
                font-size: 1.5rem;
            }
            .pdf-container iframe {
                min-height: 420px;
            }
            main {
                padding: 22px 16px 44px;
            }
            .program-grid .code {
                font-size: 1.5rem;
            }
            .doc-actions {
                flex-direction: column;
            }
            .btn-open,
            .btn-back {
                width: 100%;
                justify-content: center;
            }
            .page-header-row {
                grid-template-columns: 1fr;
                justify-items: center;
                gap: 8px;
            }
            .page-header-row .btn-back {
                justify-self: center;
                order: 1;
            }
            .page-header-row h2 {
                order: 2;
            }
        }
        @media (max-width: 479px) {
            .program-grid>*,
            .area-grid>*,
            .param-grid>*,
            .doc-grid>*,
            .hierarchy-grid>* {
                flex: 0 0 100%;
                height: 100px;
            }
        }

        /* ===== ANIMATION ===== */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        #app {
            animation: fadeUp .4s var(--ease);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo-section">
                <div class="logo">
                    <img src="images/OMSU-Logo.png" alt="OMSC Logo" onerror="this.parentElement.innerHTML='OMSC'" />
                </div>
                <div class="title-block">
                    <h1>Occidental Mindoro State University</h1>
                    <span class="tagline">AACCUP</span>
                </div>
            </div>
        </div>
    </header>

    <main id="app"></main>

    <footer>
        <p>&copy; 2026 Occidental Mindoro State University &mdash; <strong>AACCUP Accreditation Document Management System</strong></p>
    </footer>

    <script>
        // =========================================================
        // DATA
        // =========================================================
        var PROGRAMS = {
            BSIT: 'Bachelor of Science in Information Technology',
            BEED: 'Bachelor of Elementary Education',
            BSBA: 'Bachelor of Science in Business Administration'
        };

        var AREAS_FULL = {
            1: {
                name: 'Vision, Mission, Goals, and Objectives',
                params: {
                    A: 'PARAMETER A: STATEMENT OF VISION, MISSION, GOALS AND OBJECTIVES',
                    B: 'PARAMETER B: DISSEMINATION AND ACCEPTABILITY'
                }
            },
            2: {
                name: 'Faculty',
                params: {
                    A: 'PARAMETER A: ACADEMIC QUALIFICATIONS AND PROFESSIONAL EXPERIENCE',
                    B: 'PARAMETER B: RECRUITMENT, SELECTION, AND ORIENTATION',
                    C: 'PARAMETER C: FACULTY ADEQUACY AND LEADING',
                    D: 'PARAMETER D: RANK AND TENURE',
                    E: 'PARAMETER E: FACULTY DEVELOPMENT',
                    F: 'PARAMETER F: PROFESSIONAL PERFORMANCE AND SCHOLARLY WORKS',
                    G: 'PARAMETER G: SALARIES, FRINGE BENEFITS, AND INCENTIVES',

        // =========================================================
        // HIERARCHY BUILDER (unchanged)
        // =========================================================
        function parseHierarchyCode(name) {
            var cleaned = name.replace(/\.\s+/g, '.').replace(/\s+\./g, '.');
            var match = cleaned.match(/^([A-Z]\.\d+(?:\.\d+)*)/);
            return match ? match[1] : null;
        }

        function buildHierarchy(files) {
            var root = { children: [] };
            var nodeMap = {};
            files.forEach(function(file) {
                var code = parseHierarchyCode(file.name);
                if (!code) return;
                if (!nodeMap[code]) {
                    nodeMap[code] = { code: code, name: file.name, id: null, index: null, children: [] };
                }
            });
            files.forEach(function(file, index) {
                var code = parseHierarchyCode(file.name);
                if (!code) {
                    root.children.push({ code: null, name: file.name, id: file.id, index: index, children: [] });
                    return;
                }
                var node = nodeMap[code];
                if (node) { node.id = file.id;
                    node.index = index;
                    node.name = file.name; }
            });
            var allCodes = Object.keys(nodeMap);
            allCodes.forEach(function(code) {
                var parts = code.split('.');
                if (parts.length === 1) {
                    root.children.push(nodeMap[code]);
                } else {
                    var parentCode = parts.slice(0, -1).join('.');
                    if (nodeMap[parentCode]) nodeMap[parentCode].children.push(nodeMap[code]);
                    else root.children.push(nodeMap[code]);
                }
            });

            function sortChildren(node) {
                if (node.children) {
                    node.children.sort(function(a, b) {
                        var aParts = a.code.split('.');
                        var bParts = b.code.split('.');
                        for (var i = 0; i < Math.min(aParts.length, bParts.length); i++) {
                            if (aParts[i] !== bParts[i]) {
                                var aNum = parseInt(aParts[i]);
                                var bNum = parseInt(bParts[i]);
                                if (!isNaN(aNum) && !isNaN(bNum)) return aNum - bNum;
                                return aParts[i].localeCompare(bParts[i]);
                            }
                        }
                        return aParts.length - bParts.length;
                    });
                    node.children.forEach(sortChildren);
                }
            }
            sortChildren(root);
            return root.children;
        }

        // ===== DYNAMIC BASE PATH DETECTION =====
        function getBasePath() {
            var base = document.querySelector('base');
            if (base) {
                var href = base.getAttribute('href');
                if (href) {
                    return href.replace(/\/$/, '');
                }
            }
            var pathname = window.location.pathname;
            var parts = pathname.split('/').filter(Boolean);
            if (parts.length > 0) {
                var first = parts[0];
                if (!PROGRAMS[first]) {
                    return '/' + first;
                }
            }
            return '';
        }

        // ===== parsePath (with 404) =====
        function parsePath() {
            var base = getBasePath();
            var path = window.location.pathname.replace(/\/$/, '');
            if (base && path.startsWith(base)) {
                path = path.substring(base.length) || '/';
            }
            var parts = path.split('/').filter(Boolean);

            if (parts.length === 0) return { page: 'landing' };
            if (parts.length === 1) {
                var prog = parts[0];
                if (PROGRAMS[prog]) return { page: 'program', program: prog };
                else return { page: 'notfound' };
            }
            if (parts.length === 2) {
                var prog2 = parts[0];
                var area = parts[1];
                if (PROGRAMS[prog2] && AREAS_FULL[area]) {
                    return { page: 'area', program: prog2, area: area };
                } else {
                    return { page: 'notfound' };
                }
            }
            if (parts.length === 3) {
                var prog3 = parts[0];
                var area2 = parts[1];
                var param = parts[2];
                var params = getParamsForProgram(prog3, area2);
                if (PROGRAMS[prog3] && AREAS_FULL[area2] && params[param]) {
                    return { page: 'parameter', program: prog3, area: area2, param: param };
                } else {
                    return { page: 'notfound' };
                }
            }
            if (parts.length === 4) {
                var prog4 = parts[0];
                var area3 = parts[1];
                var param2 = parts[2];
                var cat = parts[3];
                var params2 = getParamsForProgram(prog4, area3);
                var categories = getCategoriesForParam(prog4, area3, param2);
                var validCat = categories.some(function(c) { return c.key === cat; });
                if (PROGRAMS[prog4] && AREAS_FULL[area3] && params2[param2] && validCat) {
                    return { page: 'category', program: prog4, area: area3, param: param2, category: cat };
                } else {
                    return { page: 'notfound' };
                }
            }
            if (parts.length === 5) {
                var prog5 = parts[0];
                var area4 = parts[1];
                var param3 = parts[2];
                var cat2 = parts[3];
                var idx = parseInt(parts[4]);
                var params3 = getParamsForProgram(prog5, area4);
                var categories2 = getCategoriesForParam(prog5, area4, param3);
                var validCat2 = categories2.some(function(c) { return c.key === cat2; });
                if (PROGRAMS[prog5] && AREAS_FULL[area4] && params3[param3] && validCat2 && !isNaN(idx)) {
                    return { page: 'document', program: prog5, area: area4, param: param3, category: cat2, fileIndex: idx };
                } else {
                    return { page: 'notfound' };
                }
            }
            return { page: 'notfound' };
        }

        function navigateTo(page, data) {
            data = data || {};
            var currentScroll = window.scrollY;
            state = Object.assign({}, state, { page: page }, data);

            var pathParts = [];
            if (data.program) pathParts.push(data.program);
            if (data.area) pathParts.push(data.area);
            if (data.param) pathParts.push(data.param);
            if (data.category) pathParts.push(data.category);
            if (data.fileIndex !== undefined && data.fileIndex !== null) pathParts.push(data.fileIndex);

            var newPath = '/' + pathParts.join('/');
            if (newPath === '/') newPath = '/';
            var base = getBasePath();
            var fullPath = base + newPath;

            history.pushState({ state: state, scrollY: currentScroll }, '', fullPath);
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.addEventListener('popstate', function(event) {
            if (event.state && event.state.state) {
                state = Object.assign({}, state, event.state.state);
                if (event.state.scrollY !== undefined) {
                    setTimeout(function() {
                        window.scrollTo(0, event.state.scrollY);
                    }, 50);
                }
            } else {
                var parsed = parsePath();
                state = Object.assign({}, state, parsed);
            }
            render();
        });

        function crumb(items) {
            var clickable = items.slice(0, -1);
            var html = '<nav class="breadcrumb">';
            clickable.forEach(function(it, i) {
                html += '<a href="#" data-crumb="' + i + '">' + it.label + '</a>';
                if (i < clickable.length - 1) html += '<span class="sep">/</span>';
            });
            if (items.length > 0) {
                var last = items[items.length - 1];
                if (clickable.length > 0) html += '<span class="sep">/</span>';
                html += '<span class="current">' + last.label + '</span>';
            }
            html += '</nav>';
            return html;
        }

        function bindCrumbs(container, items) {
            var clickable = items.slice(0, -1);
            container.querySelectorAll('[data-crumb]').forEach(function(a) {
                var idx = Number(a.dataset.crumb);
                if (idx < clickable.length) {
                    a.addEventListener('click', function(e) { e.preventDefault();
                        clickable[idx].go(); });

            });

        function render() {

            var node;
            switch (state.page) {

                case 'program':
                    node = renderProgram();
                    break;
                case 'area':
                    node = renderArea();
                    break;
                case 'parameter':
                    node = renderParameter();
                    break;
                case 'category':
                    node = renderCategory();
                    break;
                case 'document':
                    node = renderDocument();
                    break;
                case 'notfound':
                    node = renderNotFound();
                    break;
                default:
                    node = renderNotFound();
            }

            app.appendChild(node);
            void app.offsetWidth;
            app.style.animation = 'none';
            void app.offsetHeight;
            app.style.animation = '';
            app.classList.add('is-visible');

            updatePageTitle();
            updateCanonical();
        }

        // ===== RENDER LANDING =====
        function renderLanding() {
            var wrap = document.createElement('div');
            var crumbItems = [
                { label: 'Home', go: function() { navigateTo('landing', { currentPath: [] }); } }
            ];
            var html = crumb(crumbItems) +
                '<section class="hero">' +
                '<span class="eyebrow">AACCUP Level III · Area-Based Survey</span>' +
                '<h2>Accreditation Document System</h2>' +
                '<p>Select a program to browse its accreditation evidence, organized by Area, Parameter, and document category.</p>' +
                '</section>' +
                '<section class="program-grid">';
            var programs = Object.keys(PROGRAMS);
            for (var p = 0; p < programs.length; p++) {
                var code = programs[p];
                var full = PROGRAMS[code];
                html += '<button class="btn-program" data-program="' + code + '">' +
                    '<span class="code">' + code + '</span>' +
                    '<span class="full">' + full + '</span>' +
                    '</button>';
            }
            html += '</section>';
            wrap.innerHTML = html;
            bindCrumbs(wrap, crumbItems);
            wrap.querySelectorAll('.btn-program').forEach(function(b) {
                b.addEventListener('click', function() {
                    navigateTo('program', { program: b.dataset.program, currentPath: [] });
                });
            });
            return wrap;
        }

        // ===== RENDER PROGRAM =====
        function renderProgram() {
            var program = state.program;
            var wrap = document.createElement('div');
            var crumbItems = [
                { label: 'Home', go: function() { navigateTo('landing', { currentPath: [] }); } },
                { label: program, go: function() { navigateTo('program', { program: program, currentPath: [] }); } }
            ];
            var html = crumb(crumbItems) +
                '<div class="page-header-row">' +
                '<button class="btn-back" data-back-home>← Back to Home</button>' +
                '<h2>' + program + ' — ' + PROGRAMS[program] + '</h2>' +
                '<span class="spacer"></span>' +
                '</div>' +
                '<div class="area-grid">';
            var areaKeys = Object.keys(AREAS_FULL);
            for (var a = 0; a < areaKeys.length; a++) {
                var key = areaKeys[a];
                var areaName = getAreaNameForProgram(program, key);
                html += '<button class="btn-area" data-area="' + key + '">' +
                    '<span class="num">' + key + '</span>' +
                    '<span class="label">' + areaName + '</span>' +
                    '<span class="arrow">›</span>' +
                    '</button>';
            }
            html += '</div>';
            wrap.innerHTML = html;
            bindCrumbs(wrap, crumbItems);
            wrap.querySelector('[data-back-home]').addEventListener('click', function() {
                navigateTo('landing', { currentPath: [] });
            });
            wrap.querySelectorAll('.btn-area').forEach(function(b) {
                b.addEventListener('click', function() {
                    navigateTo('area', { program: program, area: b.dataset.area, currentPath: [] });
                });
            });
            return wrap;
        }

        // ===== RENDER AREA =====
        function renderArea() {
            var program = state.program;
            var area = state.area;
            var areaName = getAreaNameForProgram(program, area);
            var params = getParamsForProgram(program, area);
            var wrap = document.createElement('div');
            var crumbItems = [
                { label: 'Home', go: function() { navigateTo('landing', { currentPath: [] }); } },
                { label: program, go: function() { navigateTo('program', { program: program, currentPath: [] }); } },
                { label: 'Area ' + area, go: function() { navigateTo('area', { program: program, area: area,
                        currentPath: [] }); } }
            ];
            var html = crumb(crumbItems) +
                '<div class="page-header-row">' +
                '<button class="btn-back" data-back-program>← Back to ' + program + '</button>' +
                '<h2>' + areaName + '</h2>' +
                '<span class="spacer"></span>' +
                '</div>' +
                '<div class="param-grid">';
            var paramKeys = Object.keys(params);
            for (var p = 0; p < paramKeys.length; p++) {
                var code = paramKeys[p];
                var name = params[code];
                html += '<button class="btn-param" data-param="' + code + '">' +
                    '<span class="letter">' + code + '</span>' +
                    '<span class="label">' + name + '</span>' +
                    '<span class="arrow">›</span>' +
                    '</button>';
            }
            html += '</div>';
            wrap.innerHTML = html;
            bindCrumbs(wrap, crumbItems);
            wrap.querySelector('[data-back-program]').addEventListener('click', function() {
                navigateTo('program', { program: program, currentPath: [] });
            });
            wrap.querySelectorAll('.btn-param').forEach(function(b) {
                b.addEventListener('click', function() {
                    navigateTo('parameter', { program: program, area: area, param: b.dataset.param,
                        currentPath: [] });
                });
            });
            return wrap;
        }

        // ===== RENDER PARAMETER (GAMIT ANG DYNAMIC CATEGORIES) =====
        function renderParameter() {
            var program = state.program;
            var area = state.area;
            var param = state.param;
            var params = getParamsForProgram(program, area);
            var paramName = params[param] || 'Parameter ' + param;
            var categories = getCategoriesForParam(program, area, param);

            var wrap = document.createElement('div');
            var crumbItems = [
                { label: 'Home', go: function() { navigateTo('landing', { currentPath: [] }); } },
                { label: program, go: function() { navigateTo('program', { program: program, currentPath: [] }); } },
                { label: 'Area ' + area, go: function() { navigateTo('area', { program: program, area: area,
                        currentPath: [] }); } },
                { label: 'Parameter ' + param, go: function() { navigateTo('parameter', { program: program,
                        area: area, param: param, currentPath: [] }); } }
            ];
            var html = crumb(crumbItems) +
                '<div class="page-header-row">' +
                '<button class="btn-back" data-back-area>← Back to Area ' + area + '</button>' +
                '<h2>' + paramName + '</h2>' +
                '<span class="spacer"></span>' +
                '</div>' +
                '<div class="doc-grid">';
            for (var c = 0; c < categories.length; c++) {
                var cat = categories[c];
                html += '<button class="btn-doc" data-cat="' + cat.key + '">' +
                    '<span class="icon">' + cat.icon + '</span>' +
                    '<span class="label">' + cat.label + '</span>' +
                    '<span class="desc"></span>' +
                    '</button>';
            }
            html += '</div>';
            wrap.innerHTML = html;
            bindCrumbs(wrap, crumbItems);
            wrap.querySelector('[data-back-area]').addEventListener('click', function() {
                navigateTo('area', { program: program, area: area, currentPath: [] });
            });
            wrap.querySelectorAll('.btn-doc').forEach(function(b) {
                b.addEventListener('click', function() {
                    navigateTo('category', { program: program, area: area, param: param,
                        category: b.dataset.cat, currentPath: [] });
                });
            });
            return wrap;
        }

        // ===== RENDER CATEGORY (unchanged) =====
        function renderCategory() {
            var program = state.program;
            var area = state.area;
            var param = state.param;
            var category = state.category;
            var params = getParamsForProgram(program, area);
            var paramName = params[param] || 'Parameter ' + param;
            var areaName = getAreaNameForProgram(program, area);
            var categories = getCategoriesForParam(program, area, param);
            var catInfo = categories.find(function(c) { return c.key === category; });

            var files = getDocumentFiles(program, area, param, category);
            var tree = buildHierarchy(files);

            if (!state.currentPath || !Array.isArray(state.currentPath)) state.currentPath = [];
            var currentNode = { children: tree };
            for (var cp = 0; cp < state.currentPath.length; cp++) {
                var code = state.currentPath[cp];
                var child = null;
                for (var cc = 0; cc < currentNode.children.length; cc++) {
                    if (currentNode.children[cc].code === code) { child = currentNode.children[cc]; break; }
                }
                if (!child) { state.currentPath = [];
                    currentNode = { children: tree }; break; }
                currentNode = child;
            }
            var displayNodes = currentNode.children || [];

            var pathLabels = [];
            var temp = { children: tree };
            for (var lp = 0; lp < state.currentPath.length; lp++) {
                var cCode = state.currentPath[lp];
                var found = null;
                for (var fc = 0; fc < temp.children.length; fc++) {
                    if (temp.children[fc].code === cCode) { found = temp.children[fc]; break; }
                }
                if (!found) break;
                pathLabels.push({ code: found.code, name: found.name });
                temp = found;
            }

            var wrap = document.createElement('div');
            var crumbItems = [
                { label: 'Home', go: function() { navigateTo('landing', { currentPath: [] }); } },
                { label: program, go: function() { navigateTo('program', { program: program, currentPath: [] }); } },
                { label: 'Area ' + area, go: function() { navigateTo('area', { program: program, area: area,
                        currentPath: [] }); } },
                { label: 'Parameter ' + param, go: function() { navigateTo('parameter', { program: program,
                        area: area, param: param, currentPath: [] }); } },
                { label: catInfo ? catInfo.label : category, go: function() { navigateTo('category', { program: program,
                        area: area, param: param, category: category, currentPath: [] }); } }
            ];
            for (var pl = 0; pl < pathLabels.length; pl++) {
                (function(idx) {
                    var p = pathLabels[idx];
                    var pathUpTo = state.currentPath.slice(0, idx + 1);
                    crumbItems.push({
                        label: p.code,
                        go: function() { navigateTo('category', { program: program, area: area, param: param,
                                category: category, currentPath: pathUpTo }); }
                    });
                })(pl);
            }
            var breadcrumbHTML = crumb(crumbItems);

            var backTarget, backLabel;
            if (state.currentPath && state.currentPath.length > 0) {
                var parentPath = state.currentPath.slice(0, -1);
                backTarget = function() { navigateTo('category', { program: program, area: area, param: param,
                        category: category, currentPath: parentPath }); };
                backLabel = '← Back';
            } else {
                backTarget = function() { navigateTo('parameter', { program: program, area: area, param: param,
                        currentPath: [] }); };
                backLabel = '← Back to Parameter';
            }

            var htmlContent = breadcrumbHTML +
                '<div class="page-header-row">' +
                '<button class="btn-back" data-back-category>' + backLabel + '</button>' +
                '<h2>' + (catInfo ? catInfo.label : category) + '</h2>' +
                '<span class="spacer"></span>' +
                '</div>';

            if (displayNodes.length === 0) {
                htmlContent +=
                    '<div class="empty-state"><div class="icon">📁</div><h3>No items in this level</h3><p>This folder is empty.</p></div>';
            } else {
                htmlContent += '<div class="hierarchy-grid">';
                for (var dn = 0; dn < displayNodes.length; dn++) {
                    var node = displayNodes[dn];
                    var isLeaf = node.children.length === 0;
                    var icon = isLeaf ? '📄' : '📂';
                    var dataAttr = isLeaf ? 'data-index="' + node.index + '"' : 'data-code="' + node.code + '"';
                    htmlContent += '<button class="btn-file" ' + dataAttr + '>' +
                        '<span class="file-icon">' + icon + '</span>' +
                        '<span class="file-name">' + node.name + '</span>' +
                        '<span class="arrow">›</span>' +
                        '</button>';
                }
                htmlContent += '</div>';
            }

            wrap.innerHTML = htmlContent;
            bindCrumbs(wrap, crumbItems);
            wrap.querySelector('[data-back-category]').addEventListener('click', backTarget);

            wrap.querySelectorAll('.btn-file').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var index = this.dataset.index;
                    if (index !== undefined) {
                        navigateTo('document', { program: program, area: area, param: param,
                            category: category, fileIndex: parseInt(index) });
                    } else {
                        var code2 = this.dataset.code;
                        if (code2) {
                            var newPath = state.currentPath.concat([code2]);
                            navigateTo('category', { program: program, area: area, param: param,
                                category: category, currentPath: newPath });
                        }
                    }
                });
            });
            return wrap;
        }

        // ===== RENDER DOCUMENT (unchanged) =====
        function renderDocument() {
            var program = state.program;
            var area = state.area;
            var param = state.param;
            var category = state.category;
            var fileIndex = state.fileIndex;
            var params = getParamsForProgram(program, area);
            var paramName = params[param] || 'Parameter ' + param;
            var categories = getCategoriesForParam(program, area, param);
            var catInfo = categories.find(function(c) { return c.key === category; });

            var files = getDocumentFiles(program, area, param, category);
            var file = files[fileIndex];

            var wrap = document.createElement('div');
            var crumbItems = [
                { label: 'Home', go: function() { navigateTo('landing', { currentPath: [] }); } },
                { label: program, go: function() { navigateTo('program', { program: program, currentPath: [] }); } },
                { label: 'Area ' + area, go: function() { navigateTo('area', { program: program, area: area,
                        currentPath: [] }); } },
                { label: 'Parameter ' + param, go: function() { navigateTo('parameter', { program: program,
                        area: area, param: param, currentPath: [] }); } },
                { label: catInfo ? catInfo.label : category, go: function() { navigateTo('category', { program: program,
                        area: area, param: param, category: category, currentPath: state.currentPath || [] }); } }
            ];

            var filesForCategory = getDocumentFiles(program, area, param, category);
            var tree2 = buildHierarchy(filesForCategory);
            var pathLabels2 = [];
            var temp2 = { children: tree2 };
            for (var lp2 = 0; lp2 < (state.currentPath || []).length; lp2++) {
                var cCode2 = state.currentPath[lp2];
                var found2 = null;
                for (var fc2 = 0; fc2 < temp2.children.length; fc2++) {
                    if (temp2.children[fc2].code === cCode2) { found2 = temp2.children[fc2]; break; }
                }
                if (!found2) break;
                pathLabels2.push({ code: found2.code, name: found2.name });
                temp2 = found2;
            }
            for (var pl2 = 0; pl2 < pathLabels2.length; pl2++) {
                (function(idx) {
                    var p2 = pathLabels2[idx];
                    var pathUpTo2 = (state.currentPath || []).slice(0, idx + 1);
                    crumbItems.push({
                        label: p2.code,
                        go: function() { navigateTo('category', { program: program, area: area, param: param,
                                category: category, currentPath: pathUpTo2 }); }
                    });
                })(pl2);
            }

            var breadcrumbHTML = crumb(crumbItems);

            if (!file) {
                wrap.innerHTML = breadcrumbHTML +
                    '<div class="page-header-row">' +
                    '<button class="btn-back" data-back-files>← Back to files</button>' +
                    '<h2>File not found</h2>' +
                    '<span class="spacer"></span>' +
                    '</div>' +
                    '<div class="empty-state"><div class="icon">❌</div><p>The requested document could not be found.</p></div>';
                bindCrumbs(wrap, crumbItems);
                wrap.querySelector('[data-back-files]').addEventListener('click', function() {
                    navigateTo('category', { program: program, area: area, param: param, category: category,
                        currentPath: state.currentPath || [] });
                });
                return wrap;
            }

            var previewLink = getDriveLink(file.id);
            var openLink = getDriveOpenLink(file.id);
            var html2 = breadcrumbHTML +
                '<div class="page-header-row">' +
                '<button class="btn-back" data-back-files>← Back to files</button>' +
                '<h2>' + file.name + '</h2>' +
                '<span class="spacer"></span>' +
                '</div>';

            if (previewLink) {
                html2 += '<div class="pdf-container">' +
                    '<iframe src="' + previewLink + '" allow="autoplay" title="' + file.name + '"></iframe>' +
                    '</div>' +
                    '<div class="doc-actions">' +
                    '<a class="btn-open" href="' + openLink + '" target="_blank" rel="noopener">Open in new tab</a>' +
                    '</div>';
            } else {
                var isSample = file.id && file.id.indexOf('SAMPLE_') === 0;
                var msg = isSample ?
                    'This is a sample document placeholder. Please replace the file ID with an actual Google Drive file ID.' :
                    'No Google Drive file has been assigned to this document yet.';
                html2 += '<div class="empty-state">' +
                    '<div class="icon">📄</div>' +
                    '<h3>' + (isSample ? 'Sample Document' : 'Document not yet linked') + '</h3>' +
                    '<p>' + msg + '</p>' +
                    '<p style="font-size:.8rem;color:var(--ink-soft);margin-top:8px;">File ID: ' + file.id + '</p>' +
                    '</div>';
            }

            wrap.innerHTML = html2;
            bindCrumbs(wrap, crumbItems);
            wrap.querySelector('[data-back-files]').addEventListener('click', function() {
                navigateTo('category', { program: program, area: area, param: param, category: category,
                    currentPath: state.currentPath || [] });
            });
            return wrap;
        }

        // =========================================================
        // INIT
        // =========================================================
        function initApp() {
            var parsed = parsePath();
            state = Object.assign({}, state, parsed, { currentPath: [] });
            render();
        }

        document.addEventListener('DOMContentLoaded', function() {
            initApp();
        });
    </script>

</body>
</html>
