<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AACCUP Accreditation Document System — OMSC</title>
    <style>
        /* ===== ROOT ===== */
        :root {
            --primary: #0047AB;
            --primary-dark: #002a66;
            --primary-light: #3F7FE0;
            --gold: #D4AF5A;
            --gold-light: #F0D999;
            --gold-dark: #A87F2E;
            --white: #FFFFFF;
            --paper: #F4F6FA;
            --line: #E1E6EE;
            --ink: #1B2430;
            --ink-soft: #5B6472;
            --radius: 8px;
            --shadow: 0 2px 8px rgba(0, 0, 0, .06);
            --shadow-hover: 0 4px 16px rgba(0, 71, 171, .15);
            --ease: cubic-bezier(.4, 0, .2, 1);
            --blue-1: #eef5ff;
            --blue-2: #7fabe8;
            --blue-3: var(--primary-light);
            --blue-4: #1257bf;
            --blue-5: #001f4d;
            --btn-glow: rgba(63, 127, 224, .45);
        }

        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, Tahoma, Geneva, Verdana, sans-serif;
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a {
            color: inherit;
        }
        button {
            font-family: inherit;
        }

        /* ===== HEADER ===== */
        header {
            background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--white);
            padding: 14px 32px;
            box-shadow: 0 2px 14px rgba(0, 20, 60, .3);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 3px solid var(--gold);
        }
        .header-container {
            width: 100%;
            margin: 0;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo-section {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .logo {
            height: 60px;
            width: 60px;
            border-radius: 50%;
            background: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: var(--primary);
            font-size: 1.1rem;
            flex-shrink: 0;
            border: .5px solid var(--gold-light);
            box-shadow: 0 2px 10px rgba(0, 0, 0, .25);
            overflow: hidden;
        }
        .logo img {
            height: 100%;
            width: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .title-block h1 {
            font-size: 1.08rem;
            font-weight: 700;
            letter-spacing: .2px;
            line-height: 1.25;
        }
        .tagline {
            font-size: .7rem;
            opacity: .85;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            color: var(--gold-light);
        }

        /* ===== MAIN ===== */
        main {
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px 16px 60px;
            width: 100%;
        }

        /* ===== BREADCRUMB ===== */
        .breadcrumb {
            font-size: .85rem;
            padding: 0 0 18px;
            color: var(--ink-soft);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }
        .breadcrumb a {
            color: var(--primary);
            text-decoration: none;
            cursor: pointer;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background .2s var(--ease);
        }
        .breadcrumb a:hover {
            text-decoration: underline;
            background: rgba(0, 71, 171, .08);
        }
        .breadcrumb .sep {
            color: var(--line);
        }
        .breadcrumb .current {
            color: var(--ink-soft);
            font-weight: 500;
            padding: 4px 8px;
        }

        /* ===== PAGE HEADER ROW ===== */
        .page-header-row {
            display: grid;
            grid-template-columns: auto 1fr 120px;
            align-items: center;
            gap: 16px;
            margin-bottom: 30px;
        }
        .page-header-row h2 {
            text-align: center;
            margin: 0;
            font-size: clamp(1.35rem, 2.6vw, 1.9rem);
            font-weight: 800;
            letter-spacing: -0.3px;
        }
        .page-header-row .btn-back {
            justify-self: start;
            padding: 8px 20px;
            font-size: .9rem;
        }

        /* ===== HERO / LANDING ===== */
        .hero {
            text-align: center;
            padding: 20px 20px 44px;
        }
        .eyebrow {
            display: inline-block;
            font-size: .72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--primary);
            font-weight: 700;
            background: rgba(0, 71, 171, .08);
            padding: 6px 14px;
            border-radius: 999px;
            margin-bottom: 16px;
        }
        .hero h2 {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            color: var(--ink);
            margin-bottom: 12px;
            font-weight: 800;
            letter-spacing: -.5px;
        }
        .hero p {
            font-size: 1.1rem;
            color: var(--ink-soft);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* ===== UNIFIED GRID — FLEX + EQUAL SIZE ===== */
        .program-grid,
        .area-grid,
        .param-grid,
        .doc-grid,
        .hierarchy-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-top: 24px;
        }

        .program-grid>*,
        .area-grid>*,
        .param-grid>*,
        .doc-grid>*,
        .hierarchy-grid>* {
            flex: 0 0 calc(25% - 16px);
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            text-align: center;
            word-break: break-word;
            border-radius: 12px;
            background:
                radial-gradient(120% 140% at 20% -20%, rgba(255, 255, 255, .55) 0%, rgba(255, 255, 255, 0) 45%),
                linear-gradient(165deg, var(--blue-3) 0%, var(--blue-4) 42%, var(--blue-5) 100%);
            border: 1px solid rgba(0, 20, 60, .4);
            color: var(--white);
            text-shadow: 0 1px 3px rgba(0, 10, 40, .45);
            box-shadow:
                0 4px 14px rgba(0, 20, 60, .28),
                inset 0 1px 0 rgba(255, 255, 255, .55),
                inset 0 -10px 16px rgba(0, 10, 40, .28);
            transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s var(--ease), background .35s var(--ease);
            cursor: pointer;
            font-weight: 600;
            position: relative;
            isolation: isolate;
            overflow: hidden;
            text-decoration: none;
        }

        .program-grid>*::before,
        .area-grid>*::before,
        .param-grid>*::before,
        .doc-grid>*::before,
        .hierarchy-grid>*::before {
            content: '';
            position: absolute;
            top: 0;
            left: 14%;
            right: 14%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-light) 50%, transparent);
            opacity: .75;
            z-index: 1;
        }

        .program-grid>*:hover,
        .area-grid>*:hover,
        .param-grid>*:hover,
        .doc-grid>*:hover,
        .hierarchy-grid>*:hover {
            background:
                radial-gradient(120% 140% at 20% -20%, rgba(255, 255, 255, .65) 0%, rgba(255, 255, 255, 0) 48%),
                linear-gradient(165deg, #6fa2ea 0%, var(--primary-light) 42%, var(--blue-4) 100%);
            border-color: var(--gold);
            transform: translateY(-3px);
            box-shadow:
                0 10px 24px rgba(0, 20, 60, .35),
                0 0 0 4px var(--btn-glow),
                inset 0 1px 0 rgba(255, 255, 255, .65),
                inset 0 -10px 16px rgba(0, 10, 40, .22);
        }

        /* ===== PROGRAM BUTTONS ===== */
        .program-grid>* {
            flex-direction: column;
            padding: 20px 16px;
        }
        .program-grid .code {
            display: block;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #ffffff, var(--gold-light));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 1px 2px rgba(0, 10, 40, .5));
            margin-bottom: 4px;
        }
        .program-grid .full {
            font-size: .85rem;
            font-weight: 400;
            color: var(--white);
            opacity: .92;
            -webkit-text-fill-color: var(--white);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            max-height: 3.6em;
            line-height: 1.2;
        }

        /* ===== AREA & PARAM BUTTONS ===== */
        .area-grid>*, .param-grid>* {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            text-align: left;
            font-size: .95rem;
        }
        .area-grid .num, .param-grid .letter {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: linear-gradient(160deg, var(--gold-light) 0%, var(--gold) 55%, var(--gold-dark) 100%);
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: .78rem;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .6);
        }
        .area-grid .label, .param-grid .label, .doc-grid .label {
            flex: 1;
            font-weight: 600;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            max-height: 3.6em;
            line-height: 1.2;
        }

        /* ===== DOCUMENT CATEGORY BUTTONS ===== */
        .doc-grid>* {
            flex-direction: column;
            padding: 16px 12px;
        }
        .doc-grid .icon {
            font-size: 2rem;
            display: block;
            margin-bottom: 6px;
        }

        /* ===== BUTTONS ===== */
        .btn-back {
            background: linear-gradient(180deg, #ffffff 0%, var(--paper) 100%);
            border: 2px solid var(--line);
            color: var(--primary);
            padding: 8px 20px;
            border-radius: var(--radius);
            font-size: .9rem;
            cursor: pointer;
            font-weight: 600;
            transition: all .25s var(--ease);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-back:hover {
            background: linear-gradient(180deg, #ffffff 0%, #eef4ff 100%);
            border-color: var(--primary);
            color: var(--primary-dark);
            transform: translateY(-2px);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1023px) {
            .program-grid>*, .area-grid>*, .param-grid>*, .doc-grid>*, .hierarchy-grid>* {
                flex: 0 0 calc(33.33% - 16px);
                height: 120px;
            }
        }
        @media (max-width: 767px) {
            .program-grid>*, .area-grid>*, .param-grid>*, .doc-grid>*, .hierarchy-grid>* {
                flex: 0 0 calc(50% - 12px);
                height: 110px;
            }
            .page-header-row {
                grid-template-columns: 1fr;
                justify-items: center;
            }
        }
        @media (max-width: 479px) {
            .program-grid>*, .area-grid>*, .param-grid>*, .doc-grid>*, .hierarchy-grid>* {
                flex: 0 0 100%;
                height: 100px;
            }
        }

        /* ===== ANIMATION ===== */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #app { animation: fadeUp .4s var(--ease); }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo-section">
                <div class="logo">
                    <img src="images/OMSU-Logo.png" alt="OMSC Logo" onerror="this.parentElement.innerHTML='OMSC'" />
                </div>
                <div class="title-block">
                    <h1>Occidental Mindoro State University</h1>
                    <span class="tagline">AACCUP</span>
                </div>
            </div>
        </div>
    </header>

    <main id="app"></main>

    <footer>
        <p>&copy; 2026 Occidental Mindoro State University &mdash; <strong>AACCUP Accreditation Document Management System</strong></p>
    </footer>

    <script>
        // =========================================================
        // DATA
        // =========================================================
        var PROGRAMS = {
            BSIT: 'Bachelor of Science in Information Technology',
            BEED: 'Bachelor of Elementary Education',
            BSBA: 'Bachelor of Science in Business Administration'
        };

        var AREAS_FULL = {
            1: {
                name: 'Vision, Mission, Goals, and Objectives',
                params: {
                    A: 'PARAMETER A: STATEMENT OF VISION, MISSION, GOALS AND OBJECTIVES',
                    B: 'PARAMETER B: DISSEMINATION AND ACCEPTABILITY'
                }
            },
            2: {
                name: 'Faculty',
                params: {
                    A: 'PARAMETER A: ACADEMIC QUALIFICATIONS AND PROFESSIONAL EXPERIENCE',
                    B: 'PARAMETER B: RECRUITMENT, SELECTION, AND ORIENTATION',
                    C: 'PARAMETER C: FACULTY ADEQUACY AND LEADING',
                    D: 'PARAMETER D: RANK AND TENURE',
                    E: 'PARAMETER E: FACULTY DEVELOPMENT',
                    F: 'PARAMETER F: PROFESSIONAL PERFORMANCE AND SCHOLARLY WORKS',
                    G: 'PARAMETER G: SALARIES, FRINGE BENEFITS, AND INCENTIVES',
                    H: 'PARAMETER H: PROFESSIONALISM'
                }
            },
            3: {
                name: 'Curriculum and Instruction',
                params: {
                    A: 'PARAMETER A: CURRICULUM AND PROGRAM STUDIES',
                    B: 'PARAMETER B: INSTRUCTIONAL PROCESS, METHODOLOGIES AND LEARNING OPPORTUNITIES',
                    C: 'PARAMETER C: ASSESSMENT OF ACADEMIC PERFORMANCE',
                    D: 'PARAMETER D: MANAGEMENT OF LEARNING',
                    E: 'PARAMETER E: GRADUATION REQUIREMENTS',
                    F: 'PARAMETER F: ADMINISTRATIVE SUPPORT FOR EFFECTIVE INSTRUCTION'
                }
            },
            4: {
                name: 'Student Services',
                params: {
                    A: 'PARAMETER A: STUDENT SERVICES PROGRAM (SSP)',
                    B: 'PARAMETER B: STUDENT WELFARE',
                    C: 'PARAMETER C: STUDENT DEVELOPMENT',
                    D: 'PARAMETER D: INSTITUTIONAL STUDENT PROGRAM AND SERVICE',
                    E: 'PARAMETER E: RESEARCH, MONITORING AND EVALUATION'
                }
            },
            5: {
                name: 'Research',
                params: {
                    A: 'PARAMETER A: PRIORITIES AND RELEVANCE',
                    B: 'PARAMETER B: FUNDING AND OTHER RESOURCES',
                    C: 'PARAMETER C: IMPLEMENTATION, MONITORING, EVALUATION AND UTILIZATION OF RESEARCH RESULTS/OUTPUTS',
                    D: 'PARAMETER D: PUBLICATION AND DISSEMINATION'
                }
            },
            6: {
                name: 'Extension and Community Involvement',
                params: {
                    A: 'PARAMETER A: PRIORITIES AND RELEVANCE',
                    B: 'PARAMETER B: PLANNING, IMPLEMENTATION, MONITORING, AND EVALUATION',
                    C: 'PARAMETER C: FUNDING AND OTHER RESOURCES',
                    D: 'PARAMETER D: MANAGEMENT OF LEARNING'
                }
            },
            7: {
                name: 'Library',
                params: {
                    A: 'PARAMETER A: ORGANIZATION AND ADMINISTRATION',
                    B: 'PARAMETER B: COLLECTION DEVELOPMENT, ORGANIZATION AND PRESERVATION',
                    C: 'PARAMETER C: LIBRARY SERVICES AND UTILIZATION',
                    D: 'PARAMETER D: PHYSICAL FACILITIES AND EQUIPMENT',
                    E: 'PARAMETER E: LIBRARY PERSONNEL',
                    F: 'PARAMETER F: FINANCIAL SUPPORT',
                    G: 'PARAMETER G: LINKAGES AND NETWORKING',
                    H: 'PARAMETER H: EVALUATION AND MONITORING'
                }
            },
            8: {
                name: 'Physical Plant and Facilities',
                params: {
                    A: 'PARAMETER A: CAMPUS',
                    B: 'PARAMETER B: BUILDINGS',
                    C: 'PARAMETER C: CLASSROOMS',
                    D: 'PARAMETER D: OFFICE AND STAFF ROOMS',
                    E: 'PARAMETER E: ASSEMBLY, ATHLETIC AND SPORTS FACILITIES',
                    F: 'PARAMETER F: MEDICAL AND DENTAL CLINIC',
                    G: 'PARAMETER G: STUDENT CENTER',
                    H: 'PARAMETER H: FOOD SERVICES/CANTEEN/CAFETERIA',
                    I: 'PARAMETER I: ACCREDITATION CENTER',
                    J: 'PARAMETER J: HOUSING (optional)'
                }
            },
            9: {
                name: 'Laboratories',
                params: {
                    A: 'PARAMETER A: LABORATORIES, SHOPS/FACILITIES',
                    B: 'PARAMETER B: EQUIPMENT AND MATERIALS',
                    C: 'PARAMETER C: MAINTENANCE',
                    D: 'PARAMETER D: SPECIAL PROVISIONS'
                }
            },
            10: {
                name: 'Administration',
                params: {
                    A: 'PARAMETER A: ORGANIZATIONAL',
                    B: 'PARAMETER B: ACADEMIC ADMINISTRATION',
                    C: 'PARAMETER C: STUDENT ADMINISTRATION',
                    D: 'PARAMETER D: FINANCIAL MANAGEMENT',
                    E: 'PARAMETER E: SUPPLY MANAGEMENT',
                    F: 'PARAMETER F: RECORDS MANAGEMENT',
                    G: 'PARAMETER G: INSTITUTIONAL PLANNING AND DEVELOPMENT',
                    H: 'PARAMETER H: PERFORMANCE OF ADMINISTRATIVE PERSONNEL'
                }
            }
        };

        var PROGRAM_PARAMS_CUSTOM = {
            BEED: { 1: { A: 'Parameter A (sample)' } },
            BSBA: { 1: { A: 'Parameter A (sample)' } }
        };

        var CATEGORIES = [
            { key: 'SIP', label: 'System — Inputs and Processes', icon: '📋' },
            { key: 'IMP', label: 'Implementation', icon: '⚙️' },
            { key: 'OUT', label: 'Outcome', icon: '📊' }
        ];

        // =========================================================
        // ROUTER & NAVIGATION ENGINE
        // =========================================================
        
        function navigateTo(hash) {
            window.location.hash = hash;
        }

        function cleanURL() {
            // Tinatanggal ang '.html' at '#' sa URL address bar nang hindi mina-refresh ang page
            let cleanPath = window.location.pathname.replace(/\.html$/i, '');
            history.replaceState(null, document.title, cleanPath + window.location.search);
        }

        function render() {
            var hash = window.location.hash.replace('#', '');
            var parts = hash.split('/').filter(Boolean);
            var app = document.getElementById('app');

            // 1. HOME VIEW
            if (parts.length === 0) {
                app.innerHTML = `
                    <div class="hero">
                        <span class="eyebrow">Accreditation Portal</span>
                        <h2>Select Academic Program</h2>
                        <p>Choose a degree program to view its accreditation areas and document repositories.</p>
                    </div>
                    <div class="program-grid">
                        ${Object.keys(PROGRAMS).map(code => `
                            <button onclick="navigateTo('program/${code}')">
                                <span class="code">${code}</span>
                                <span class="full">${PROGRAMS[code]}</span>
                            </button>
                        `).join('')}
                    </div>
                `;
            } 
            // 2. PROGRAM VIEW (Areas List)
            else if (parts[0] === 'program' && parts[1] && parts.length === 2) {
                var prog = parts[1];
                app.innerHTML = `
                    <div class="breadcrumb">
                        <a onclick="navigateTo('')">Home</a> <span class="sep">/</span>
                        <span class="current">${prog}</span>
                    </div>
                    <div class="page-header-row">
                        <button class="btn-back" onclick="navigateTo('')">← Back</button>
                        <h2>${PROGRAMS[prog] || prog}</h2>
                        <div></div>
                    </div>
                    <div class="area-grid">
                        ${Object.keys(AREAS_FULL).map(num => `
                            <button onclick="navigateTo('program/${prog}/area/${num}')">
                                <span class="num">${num}</span>
                                <span class="label">${AREAS_FULL[num].name}</span>
                                <span class="arrow">→</span>
                            </button>
                        `).join('')}
                    </div>
                `;
            }
            // 3. AREA VIEW (Parameters List)
            else if (parts[0] === 'program' && parts[2] === 'area' && parts.length === 4) {
                var prog = parts[1];
                var areaNum = parts[3];
                var params = (prog === 'BSIT') ? AREAS_FULL[areaNum].params : (PROGRAM_PARAMS_CUSTOM[prog]?.[areaNum] || {});
                
                app.innerHTML = `
                    <div class="breadcrumb">
                        <a onclick="navigateTo('')">Home</a> <span class="sep">/</span>
                        <a onclick="navigateTo('program/${prog}')">${prog}</a> <span class="sep">/</span>
                        <span class="current">Area ${areaNum}</span>
                    </div>
                    <div class="page-header-row">
                        <button class="btn-back" onclick="navigateTo('program/${prog}')">← Back</button>
                        <h2>Area ${areaNum}: ${AREAS_FULL[areaNum]?.name || ''}</h2>
                        <div></div>
                    </div>
                    <div class="param-grid">
                        ${Object.keys(params).map(letter => `
                            <button onclick="navigateTo('program/${prog}/area/${areaNum}/param/${letter}')">
                                <span class="letter">${letter}</span>
                                <span class="label">${params[letter]}</span>
                                <span class="arrow">→</span>
                            </button>
                        `).join('')}
                    </div>
                `;
            }
            // 4. PARAMETER VIEW (Categories List)
            else if (parts.length === 6 && parts[4] === 'param') {
                var prog = parts[1];
                var areaNum = parts[3];
                var paramLetter = parts[5];

                app.innerHTML = `
                    <div class="breadcrumb">
                        <a onclick="navigateTo('')">Home</a> <span class="sep">/</span>
                        <a onclick="navigateTo('program/${prog}')">${prog}</a> <span class="sep">/</span>
                        <a onclick="navigateTo('program/${prog}/area/${areaNum}')">Area ${areaNum}</a> <span class="sep">/</span>
                        <span class="current">Parameter ${paramLetter}</span>
                    </div>
                    <div class="page-header-row">
                        <button class="btn-back" onclick="navigateTo('program/${prog}/area/${areaNum}')">← Back</button>
                        <h2>Parameter ${paramLetter}</h2>
                        <div></div>
                    </div>
                    <div class="doc-grid">
                        ${CATEGORIES.map(cat => `
                            <button onclick="alert('Viewing documents for ${cat.label}')">
                                <span class="icon">${cat.icon}</span>
                                <span class="label">${cat.label}</span>
                            </button>
                        `).join('')}
                    </div>
                `;
            }

            // Mabilisang paglinis ng URL sa bar araw-araw
            cleanURL();
        }

        // Mag-listen sa hash navigation
        window.addEventListener('hashchange', render);
        window.addEventListener('load', render);
    </script>
</body>
</html>
