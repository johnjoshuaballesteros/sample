<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AACCUP Accreditation System — OMSC</title>
    <style>
        /* same CSS as original, except minimal adjustments */
        /* (copy the entire <style> block from the original file) */
        /* I'll include it here but you can reuse the exact same CSS */
    </style>
</head>

    <header>
        <div class="header-container">
            <div class="logo-section">
                <div class="logo">
                    <img src="images/OMSU-Logo.png" alt="OMSC Logo" onerror="this.parentElement.innerHTML='OMSC'" />
                </div>
                <div class="title-block">
                    <h1>Occidental Mindoro State University</h1>
                    <span class="tagline">AACCUP</span>
                </div>
            </div>
        </div>
    </header>

    <main id="app">
        <!-- will be rendered by JavaScript -->
    </main>

    <footer>
        <p>&copy; 2026 Occidental Mindoro State University &mdash; <strong>AACCUP Accreditation Document Management System</strong></p>
    </footer>

    <script src="data.js"></script>
    <script>
        // Home page specific logic
        (function() {
            var app = document.getElementById('app');

</body>
</html>
